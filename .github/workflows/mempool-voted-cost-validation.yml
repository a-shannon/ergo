name: Voted input cost diagnostic

on:
  push:
    branches:
      - a-shannon/mempool-voted-cost-validate-v610-20261025

permissions:
  contents: read

jobs:
  voted-cost:
    name: Vote to transaction cost specification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check exact source packet
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "da362d2e52c4e5a8ebf62b1c2a3f68c22241b062"
          git merge-base --is-ancestor 8e7cfe4a00bbf603f8a38dd980e01bdce273ebaa HEAD

      - name: Set up Java and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Run focused voting specification
        run: sbt -Denv=test ++2.12.20 "testOnly org.ergoplatform.settings.ErgoNodeVotingSpecification"
