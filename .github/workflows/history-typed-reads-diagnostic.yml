name: History typed-read identity diagnostic

on:
  push:
    branches: [feat/history-typed-reads-diagnostic-20261018]

permissions:
  contents: read

jobs:
  identity:
    if: github.repository == 'a-shannon/ergo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Exercise typed identity and startup repair together
        run: >-
          sbt -Denv=test ++2.12.20
          "testOnly org.ergoplatform.nodeView.history.storage.HistoryStorageIdentitySpec org.ergoplatform.nodeView.history.StartupContinuationRepairSpecification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typed-identity-${{ matrix.variant }}
          path: target/test-reports/
          if-no-files-found: warn
