name: Public Circe parser validation

on:
  push:
    branches:
      - a-shannon/circe-jawn-validate-v610-20261025

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Verify resolved Jawn version
        run: |
          sbt -Dsbt.supershell=false ++2.12.20 "show Compile / dependencyClasspath" > resolved-classpath.txt
          grep -q 'jawn-parser_2.12-1.7.0.jar' resolved-classpath.txt
          echo 'Resolved jawn-parser 1.7.0'

      - name: Run generic parser regression
        run: sbt -Dsbt.supershell=false ++2.12.20 "testOnly org.ergoplatform.serialization.JsonParserDepthSpec"
