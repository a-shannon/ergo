name: PR 2503 exact-head remaining node suite diagnostics

on:
  push:
    branches:
      - feat/pr2503-node-remainder-shards-20261017

permissions:
  contents: read

jobs:
  remaining-node-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - shard: history-state
            patterns: >-
              org.ergoplatform.nodeView.history.*
              org.ergoplatform.nodeView.state.*
          - shard: wallet-viewholder
            patterns: >-
              org.ergoplatform.nodeView.wallet.*
              org.ergoplatform.nodeView.viewholder.*
              org.ergoplatform.nodeView.ErgoModifiersCacheSpec
          - shard: http-mining-modifiers
            patterns: >-
              org.ergoplatform.http.*
              org.ergoplatform.mining.*
              org.ergoplatform.modifiers.*
          - shard: misc
            patterns: >-
              org.ergoplatform.db.*
              org.ergoplatform.local.*
              org.ergoplatform.serialization.*
              org.ergoplatform.settings.*
              org.ergoplatform.sanity.*
              org.ergoplatform.tools.*
              org.ergoplatform.utils.*
              scorex.testkit.*
    name: ${{ matrix.shard }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: 94065cbdd7337695edb01237e6ded2f6714fdd23
          fetch-depth: 0

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = '94065cbdd7337695edb01237e6ded2f6714fdd23'

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Build pinned SigmaState dependency
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20

      - name: Setup Java and Scala
        uses: olafurpg/setup-scala@v10
        with:
          java-version: adopt@1.8

      - name: Run selected node suites
        shell: bash
        env:
          TEST_PATTERNS: ${{ matrix.patterns }}
        run: |
          set -o pipefail
          mkdir -p diagnostic
          sbt -Denv=test ++2.12.20 "testOnly ${TEST_PATTERNS}" \
            2>&1 | tee diagnostic/node-tests.log

      - name: Verify nonempty suite results and retain suite names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          reports = sorted(Path("target/test-reports").rglob("*.xml"))
          suites = []
          tests = 0
          for path in reports:
              root = ET.parse(path).getroot()
              suites.append(root.attrib.get("name", path.stem))
              tests += int(root.attrib.get("tests", "0"))
          Path("diagnostic/selected-suites.txt").write_text(
              "\n".join(sorted(set(suites))) + "\n", encoding="utf-8"
          )
          print(f"JUnit reports: {len(reports)}; selected suites: {len(set(suites))}; tests: {tests}")
          if tests == 0:
              sys.exit(1)
          PY

      - name: Retain logs, reports and suite list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2503-node-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            diagnostic/node-tests.log
            diagnostic/selected-suites.txt
            target/test-reports/**
          if-no-files-found: warn
