name: ExtraIndexer Digest prefix diagnostic

on:
  push:
    branches:
      - feat/pr2713-digest-prefix-diagnostic-20261012

permissions:
  contents: read

jobs:
  digest-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v7
      - name: Set up Java and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run Digest prefix diagnostic
        run: sbt ++2.12.20 "testOnly org.ergoplatform.nodeView.history.extra.ExtraIndexerDigestPrefixSpec"
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: extra-indexer-digest-prefix-${{ github.run_id }}
          path: |
            target/logs
            target/test-reports
          if-no-files-found: ignore
