name: PR 2693 v6.0.9 composition diagnostic

on:
  push:
    branches:
      - feat/pr2693-v609-review-compose-20261017

permissions:
  contents: read

jobs:
  focused-test:
    if: github.repository == 'a-shannon/ergo'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1584352d23f59a2ef3bb21811ca1f82697bb7467"
          test "$(git rev-parse 2615299d9527f5891172c7268cf43bf657705530^1)" = "7416269a03519b1095da497e72c7424cec301273"
          test "$(git rev-parse 2615299d9527f5891172c7268cf43bf657705530^2)" = "a058799b285b11064f2a2b1e8769e6f49227657e"
          test -z "$(git diff --name-only 1584352d23f59a2ef3bb21811ca1f82697bb7467 HEAD -- src/main src/test)"
      - name: Set up Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Run affected snapshot suites
        timeout-minutes: 40
        run: sbt -batch -Denv=test ++2.12.20 "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification org.ergoplatform.nodeView.history.UtxoSetSnapshotProcessorSpecification"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2693-v609-composition-${{ github.run_attempt }}
          path: |
            target/test-reports/
            target/scala-2.12/test-reports/
            target/logs/
          if-no-files-found: ignore
          retention-days: 14
