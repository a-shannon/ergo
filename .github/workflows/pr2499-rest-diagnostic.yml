name: PR 2499 REST release diagnostic

on:
  push:
    branches:
      - feat/pr2499-v609-port-20261018

permissions:
  contents: read

env:
  BASE_COMMIT: 2675ebfab12f498ef5380785eeb9bdad35afb184
  PRODUCT_COMMIT: b9c8194a4f1f0904d15366a771c7326cb4a3f607

jobs:
  rest:
    if: github.repository == 'a-shannon/ergo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact product source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BASE_COMMIT" "$PRODUCT_COMMIT"
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --exit-code "$PRODUCT_COMMIT" HEAD -- . ':!.github/workflows/pr2499-rest-diagnostic.yml'
          mkdir -p target/logs
          git rev-parse HEAD > target/logs/diagnostic-head.txt
          git rev-parse "$PRODUCT_COMMIT" > target/logs/product-head.txt

      - name: Set up Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Prepare exact report checks
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/check-rest-reports.py" <<'PY'
          import pathlib, re, sys, xml.etree.ElementTree as ET
          mode, directory = sys.argv[1:]
          suites = [ET.parse(p).getroot() for p in pathlib.Path(directory).glob('TEST-*.xml')]
          names = {s.attrib['name'] for s in suites}
          assert len(names) == len(suites), names
          rows = [(s.attrib['name'], c) for s in suites for c in s.iter('testcase')]
          assert rows and all(list(s.iter('testcase')) for s in suites), names
          assert not any(list(s.iter('error')) or list(s.iter('skipped')) for s in suites)
          assert all(int(s.attrib.get(key, '0')) == 0 for s in suites for key in ('errors', 'skipped'))
          assert len({(suite, c.attrib['name']) for suite, c in rows}) == len(rows)
          failed = {(suite, c.attrib['name']): c.find('failure') for suite, c in rows
                    if c.find('failure') is not None}
          defaults = 'org.ergoplatform.settings.RestApiDefaultsSpec'
          auth = 'scorex.core.api.http.ApiAuthenticationSpec'
          if mode == 'baseline':
              assert names == {defaults, auth}, names
              assert len(rows) == 8, len(rows)
              assert {s.attrib['name']: len(list(s.iter('testcase'))) for s in suites} == {defaults: 2, auth: 6}
              expected = {
                  (defaults, 'Bundled REST profiles should use loopback and leave protected routes disabled'),
                  (auth, 'Protected routes should reject requests when no API key is configured'),
                  (auth, 'Protected routes should reject the former public default credential'),
              }
              assert set(failed) == expected, set(failed)
              for (suite, name), failure in failed.items():
                  detail = failure.attrib.get('message', '') + (failure.text or '')
                  needles = ('0.0.0.0', '127.0.0.1') if suite == defaults else ('200 OK', '403 Forbidden')
                  assert all(n in detail for n in needles), (name, detail)
          else:
              assert not failed, set(failed)
              assert all(int(s.attrib.get('failures', '0')) == 0 for s in suites)
              if mode == 'units':
                  expected = set()
                  for directory in ('src/test/scala/org/ergoplatform/http',
                                    'src/test/scala/org/ergoplatform/settings',
                                    'src/test/scala/scorex/core/api/http'):
                      for path in pathlib.Path(directory).rglob('*.scala'):
                          text = path.read_text()
                          package = re.search(r'^package\s+([\w.]+)', text, re.M)
                          classes = re.findall(r'^class\s+(\w+)\b', text, re.M)
                          expected.update(package[1] + '.' + c for c in classes)
                  direct = {defaults, auth, 'org.ergoplatform.settings.ErgoSettingsSpecification'}
                  direct.update('org.ergoplatform.http.routes.' + c + 'ApiRouteSpec'
                                for c in ('Blocks', 'Mining', 'Scan', 'Wallet'))
                  assert direct <= expected and len(expected) == 20, expected
                  assert names == expected, (names - expected, expected - names)
                  assert len(rows) == 198, len(rows)
              elif mode == 'startup':
                  assert names == {'org.ergoplatform.it.RestApiStartupSpec'}, names
                  assert len(rows) == 1 and rows[0][1].attrib['name'].endswith(
                      'should start with no REST API key while rejecting protected wallet status')
                  logs = list(pathlib.Path('target/logs').glob('RestApiStartupSpec-*.log'))
                  assert logs and all(p.stat().st_size > 0 for p in logs), logs
              else:
                  raise AssertionError(mode)
          print(f'{mode}: {len(suites)} suites, {len(rows)} cases, {len(failed)} expected failures, no errors/skips')
          PY

      - name: Matched baseline counterexamples
        shell: bash
        run: |
          set -euo pipefail
          baseline_files=(src/main/scala/scorex/core/api/http/ApiDirectives.scala
            src/main/resources/application.conf src/main/resources/mainnet.conf
            src/main/resources/testnet.conf src/main/resources/devnet.conf)
          trap 'git restore --source="$PRODUCT_COMMIT" --worktree -- "${baseline_files[@]}"' EXIT
          git restore --source="$BASE_COMMIT" --worktree -- "${baseline_files[@]}"
          set +e
          sbt -batch -Denv=test ++2.12.20 "testOnly org.ergoplatform.settings.RestApiDefaultsSpec scorex.core.api.http.ApiAuthenticationSpec" 2>&1 | tee target/logs/baseline-sbt.log
          result=${PIPESTATUS[0]}
          set -e
          mkdir -p target/baseline-reports
          cp target/test-reports/TEST-org.ergoplatform.settings.RestApiDefaultsSpec.xml target/baseline-reports/
          cp target/test-reports/TEST-scorex.core.api.http.ApiAuthenticationSpec.xml target/baseline-reports/
          test "$result" -ne 0
          python3 "$RUNNER_TEMP/check-rest-reports.py" baseline target/baseline-reports

      - name: Run HTTP and settings closure
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          sbt -batch -Denv=test ++2.12.20 "testOnly org.ergoplatform.http.* org.ergoplatform.settings.* scorex.core.api.http.ApiAuthenticationSpec" 2>&1 | tee target/logs/unit-sbt.log
          python3 "$RUNNER_TEMP/check-rest-reports.py" units target/test-reports

      - name: Build packaged node and run REST startup
        id: startup
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          TMPDIR="$(pwd)/tmp" sbt -batch -Denv=test ++2.12.20 docker "it:testOnly org.ergoplatform.it.RestApiStartupSpec" 2>&1 | tee target/logs/startup-sbt.log
          python3 "$RUNNER_TEMP/check-rest-reports.py" startup target/it-reports

      - name: Save remaining node container state and logs
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.startup.outcome }}
        shell: bash
        run: |
          mkdir -p target/logs/containers
          printf 'startup-outcome=%s\n' "$TEST_OUTCOME" > target/logs/containers/runner-state.txt
          docker version >> target/logs/containers/runner-state.txt 2>&1 || true
          docker ps -a --filter name=ergo-itest- --no-trunc >> target/logs/containers/runner-state.txt 2>&1 || true
          docker ps -a --filter name=ergo-itest- --format '{{.ID}} {{.Names}}' |
            while read -r id name; do
              [ -n "$id" ] || continue
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} finished={{.State.FinishedAt}}' "$id" >> target/logs/containers/runner-state.txt 2>&1 || true
              docker logs --timestamps "$id" > "target/logs/containers/$name.log" 2>&1 || true
            done

      - name: Retain diagnostic reports and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2499-rest-diagnostic-${{ github.run_attempt }}
          path: |
            target/baseline-reports/
            target/test-reports/
            target/it-reports/
            target/logs/
          if-no-files-found: error
          retention-days: 14
