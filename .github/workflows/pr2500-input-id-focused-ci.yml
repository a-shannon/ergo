name: PR 2500 input-ID admission focused diagnostic

on:
  push:
    branches:
      - feat/pr2500-focused-ci-20261014

permissions:
  contents: read

jobs:
  focused-node:
    name: Exercise Matrix input-ID admission
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Build pinned SigmaState dependency
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20

      - name: Setup Java and Scala
        uses: olafurpg/setup-scala@v10
        with:
          java-version: adopt@1.8

      - name: Run focused Matrix admission specs
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.network.MatrixInputIdAdmissionSpec" \
            "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification"

      - name: Inspect compiled synchronizer cache field
        if: always()
        run: javap -private -classpath target/scala-2.12/classes org.ergoplatform.network.ErgoNodeViewSynchronizer | grep -i localInputBlockChunks || true

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2500-input-id-reports
          path: target/test-reports/
          if-no-files-found: warn
          retention-days: 7
