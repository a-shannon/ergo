name: V2 deep rollback v6.0.9 composition diagnostic

on:
  push:
    branches:
      - feat/pr2689-v609-deep-rollback-diagnostic-20261013

permissions:
  contents: read

jobs:
  deep_rollback:
    name: DeepRollBackSpec on exact composed source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify composition parents
        run: |
          test "$(git rev-parse HEAD^)" = 147e126de36a91667ddc9dc71a808511d0b6f049
          test "$(git rev-parse HEAD^^1)" = 5990c8039b5ff50807b4eef8ffd3d26dd3322926
          test "$(git rev-parse HEAD^^2)" = d2f1cdab4ead9c614ab77f3ea39c66ae1894d3c8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/pr2689-v609-deep-rollback-diagnostic.yml

      - name: Setup Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Build node image and run exact DeepRollBackSpec
        timeout-minutes: 35
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -Denv=test clean ++2.12.20 docker "it:testOnly org.ergoplatform.it.DeepRollBackSpec"

      - name: Save remaining node container logs
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p target/logs/containers
          docker ps -a --filter name=ergo-itest- --format '{{.ID}} {{.Names}}' |
            while read -r id name; do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} finished={{.State.FinishedAt}}' "$id" || true
              docker logs --timestamps "$id" > "target/logs/containers/$name.log" 2>&1 || true
            done

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr2689-v609-deep-rollback-attempt-${{ github.run_attempt }}
          path: |
            target/logs/
            target/it-reports/
            target/test-reports/
          if-no-files-found: error
          retention-days: 14
