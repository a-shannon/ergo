name: Focused audit validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full source commit on this fork
        required: true
        type: string
      suite:
        description: Affected source closure
        required: true
        type: choice
        options:
          - matrix-pending
          - matrix-forks
          - matrix-mempool
          - matrix-wallet-join
          - matrix-wallet-closeout
          - digest-proof-rebuild
          - mempool-providers
          - mempool-conflicts
          - nipopow-producer
          - nipopow-validation
          - nipopow-validation-remainder
          - wallet-deep-rollback
          - wallet-v609-composition

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SUITE: ${{ inputs.suite }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$SUITE" in
            matrix-pending|matrix-forks|matrix-mempool|matrix-wallet-join|matrix-wallet-closeout|digest-proof-rebuild|mempool-providers|mempool-conflicts|nipopow-producer|nipopow-validation|nipopow-validation-remainder|wallet-deep-rollback|wallet-v609-composition) ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm tested commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"'
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Build pinned Matrix SigmaState dependency
        if: inputs.suite == 'matrix-pending' || inputs.suite == 'matrix-forks' || inputs.suite == 'matrix-mempool' || inputs.suite == 'matrix-wallet-join' || inputs.suite == 'matrix-wallet-closeout'
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20
      - name: Setup Scala and Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run Matrix pending synchronization closure
        if: inputs.suite == 'matrix-pending'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.network.MatrixInputIdAdmissionSpec" \
            "testOnly org.ergoplatform.network.llm_generated.InputBlockPendingCacheSpec" \
            "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification"
      - name: Run Matrix fork completion and sibling regressions
        if: inputs.suite == 'matrix-forks'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.modifierprocessors.InputBlockProcessorSpecification"
      - name: Run real holder fork-to-mempool regression
        if: inputs.suite == 'matrix-mempool'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run real holder wallet rollback and mempool closure
        if: inputs.suite == 'matrix-wallet-join'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run mempool provider regressions
        if: inputs.suite == 'mempool-providers'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolInputProvidersSpec"
      - name: Run affected Matrix wallet closure
        if: inputs.suite == 'matrix-wallet-closeout'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"' \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.persistence.OffChainRegistrySpec"
      - name: Run Digest proof retention through extra-index rebuild
        if: inputs.suite == 'digest-proof-rebuild'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.nodeView.history.extra.ExtraIndexerTemplateKeySpec"
      - name: Run applied transaction conflict closure
        if: inputs.suite == 'mempool-conflicts'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.AppliedTransactionConflictsSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.OrderedTxPoolSpec"
      - name: Run deep rollback integration regression
        if: inputs.suite == 'wallet-deep-rollback'
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -Denv=test clean ++2.12.20 docker \
            'it:testOnly org.ergoplatform.it.DeepRollBackSpec'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("target/it-reports/TEST-org.ergoplatform.it.DeepRollBackSpec.xml")
          suite = ET.parse(report).getroot()
          if suite.attrib.get("name") != "org.ergoplatform.it.DeepRollBackSpec":
              raise SystemExit("Unexpected integration suite")
          for key in ("tests", "failures", "errors", "skipped"):
              if key not in suite.attrib:
                  raise SystemExit(f"Missing {key} in integration report")
          tests = int(suite.attrib["tests"])
          if tests < 1 or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("DeepRollBackSpec did not pass")
          print(f"DeepRollBackSpec: {tests} test(s) passed")
          PY
      - name: Run v6.0.9 composed wallet regressions
        if: inputs.suite == 'wallet-v609-composition'
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -batch -Denv=test ++2.12.20 \
            "ergoWallet/testOnly org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec org.ergoplatform.nodeView.wallet.ErgoWalletSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec org.ergoplatform.nodeView.wallet.persistence.WalletRegistrySpec" \
            "testOnly org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification org.ergoplatform.nodeView.viewholder.ChainSwitchMempoolSpec"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = {
              "org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec": Path("ergo-wallet/target/test-reports/TEST-org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec.xml"),
              "org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec.xml"),
              "org.ergoplatform.nodeView.wallet.ErgoWalletSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.ErgoWalletSpec.xml"),
              "org.ergoplatform.nodeView.wallet.WalletScanLogicSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.WalletScanLogicSpec.xml"),
              "org.ergoplatform.nodeView.wallet.persistence.WalletRegistrySpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.persistence.WalletRegistrySpec.xml"),
              "org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification": Path("target/test-reports/TEST-org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification.xml"),
              "org.ergoplatform.nodeView.viewholder.ChainSwitchMempoolSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.viewholder.ChainSwitchMempoolSpec.xml"),
          }
          required_cases = {
              "org.ergoplatform.nodeView.wallet.ErgoWalletSpec": {
                  "reuse one actor-minted run for duplicate snapshot events and fence stale lifecycle messages",
                  "mint unique UTXO snapshot run tokens across wallet actor incarnations",
                  "fresh snapshot recovery installs each deferred registry and preserves the durable fence",
                  "quarantine startup catch-up when the next wallet block was pruned",
              },
              "org.ergoplatform.nodeView.wallet.WalletScanLogicSpec": {
                  "mining maturity does not credit an existing payment association twice",
              },
          }
          if len(reports) != 7:
              raise SystemExit("Expected seven composed-wallet suites")
          total = 0
          for name, report in reports.items():
              suite = ET.parse(report).getroot()
              if suite.tag != "testsuite" or suite.attrib.get("name") != name:
                  raise SystemExit(f"Unexpected test suite in {report}")
              for key in ("tests", "failures", "errors", "skipped"):
                  if key not in suite.attrib:
                      raise SystemExit(f"Missing {key} in {report}")
              tests = int(suite.attrib["tests"])
              if tests < 1 or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"Test suite did not pass: {name}")
              cases = {case.attrib["name"] for case in suite.findall("testcase")}
              if len(cases) != tests:
                  raise SystemExit(f"Test count mismatch in {report}")
              missing = required_cases.get(name, set()) - cases
              if missing:
                  raise SystemExit(f"Missing required cases in {name}: {sorted(missing)}")
              total += tests
          print(f"Composed wallet regressions: {total} test(s) passed across {len(reports)} suites")
          PY
      # NiPoPoW runs use the real history producer, HTTP route and P2P cache consumer.
      - name: Run NiPoPoW producer and HTTP route regressions
        if: inputs.suite == 'nipopow-producer'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.http.routes.NipopowApiRoutesSpec"
      - name: Run NiPoPoW proof and consumer closure
        if: inputs.suite == 'nipopow-validation'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec" \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Run remaining NiPoPoW consumer and cross-version checks
        if: inputs.suite == 'nipopow-validation-remainder'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.suite }}-${{ inputs.source_commit }}
          path: |
            target/test-reports/
            target/it-reports/
            ergo-core/target/test-reports/
            ergo-wallet/target/test-reports/
          if-no-files-found: warn
          retention-days: 7
