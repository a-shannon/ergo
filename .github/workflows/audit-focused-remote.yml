name: Focused audit validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full source commit on this fork
        required: true
        type: string
      suite:
        description: Affected source closure
        required: true
        type: choice
        options:
          - matrix-pending
          - matrix-forks
          - matrix-input-cache
          - history-redelivery
          - holder-ordering-prune
          - matrix-mempool
          - matrix-wallet-join
          - matrix-wallet-closeout
          - digest-proof-rebuild
          - mempool-providers
          - mempool-conflicts
          - nipopow-producer
          - nipopow-validation
          - nipopow-validation-remainder

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SUITE: ${{ inputs.suite }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$SUITE" in
            matrix-pending|matrix-forks|matrix-input-cache|matrix-mempool|matrix-wallet-join|matrix-wallet-closeout|digest-proof-rebuild|mempool-providers|mempool-conflicts|nipopow-producer|nipopow-validation|nipopow-validation-remainder) ;;
            history-redelivery) ;;
            holder-ordering-prune) ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Confirm tested commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"'
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Build pinned Matrix SigmaState dependency
        if: inputs.suite == 'matrix-pending' || inputs.suite == 'matrix-forks' || inputs.suite == 'matrix-input-cache' || inputs.suite == 'holder-ordering-prune' || inputs.suite == 'matrix-mempool' || inputs.suite == 'matrix-wallet-join' || inputs.suite == 'matrix-wallet-closeout'
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20
      - name: Setup Scala and Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run Matrix pending synchronization closure
        if: inputs.suite == 'matrix-pending'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.network.MatrixInputIdAdmissionSpec" \
            "testOnly org.ergoplatform.network.llm_generated.InputBlockPendingCacheSpec" \
            "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification"
      - name: Run Matrix fork completion and sibling regressions
        if: inputs.suite == 'matrix-forks'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.modifierprocessors.InputBlockProcessorSpecification"
      - name: Run processed input cache availability diagnostic
        if: inputs.suite == 'matrix-input-cache'
        run: |
          test ! -e target/test-reports
          report_dir="$GITHUB_WORKSPACE/target/scalatest-input-cache-reports"
          test ! -e "$report_dir"
          spec=src/test/scala/org/ergoplatform/nodeView/history/modifierprocessors/llm_generated/ProcessedInputCacheAvailabilitySpec.scala
          git ls-files --error-unmatch -- "$spec" >/dev/null
          mkdir -p "$report_dir"
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.modifierprocessors.llm_generated.ProcessedInputCacheAvailabilitySpec -- -u $report_dir"
      - name: Verify processed input cache test selection
        if: inputs.suite == 'matrix-input-cache'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          expected_class = "org.ergoplatform.nodeView.history.modifierprocessors.llm_generated.ProcessedInputCacheAvailabilitySpec"
          expected_case = "processed input body cache loss is distinct from an unprocessed input block"
          reports = sorted(Path("target/scalatest-input-cache-reports").glob("TEST-*.xml"))
          if len(reports) != 1:
              raise SystemExit(f"expected one test report, found {len(reports)}")
          root = ET.parse(reports[0]).getroot()
          suites = list(root.iter("testsuite"))
          cases = list(root.iter("testcase"))
          if len(suites) != 1 or len(cases) != 1:
              raise SystemExit(f"expected one suite and one case, found {len(suites)} and {len(cases)}")
          suite, case = suites[0], cases[0]
          if suite.get("name") not in (expected_class, expected_class.rsplit(".", 1)[-1]):
              raise SystemExit("the intended input cache suite was not selected")
          if case.get("classname") != expected_class or case.get("name") != expected_case:
              raise SystemExit("the intended input cache property was not selected")
          status = case.get("status")
          if status is not None and status.lower() not in ("pass", "passed", "success"):
              raise SystemExit(f"the selected input cache property has non-passing status {status!r}")
          if any(suite.get(key, "0") != "0" for key in ("failures", "errors", "skipped")):
              raise SystemExit("the selected input cache property did not pass")
          if suite.get("tests") != "1" or any(case.find(tag) is not None for tag in ("failure", "error", "skipped")):
              raise SystemExit("the selected input cache report is incomplete or failed")
          facts = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "suite": suite.get("name"),
              "case_class": case.get("classname"),
              "case_name": case.get("name"),
              "tests": 1,
              "failures": 0,
              "errors": 0,
              "skipped": 0,
              "xml_bytes": reports[0].stat().st_size,
              "xml_sha256": hashlib.sha256(reports[0].read_bytes()).hexdigest(),
              "status": "passed",
          }
          Path("target/input-cache-facts.json").write_text(json.dumps(facts, sort_keys=True) + "\n", encoding="utf-8")
          print(f"selected one passing input cache property in {reports[0]}")
          PY
      - name: Retain processed input cache facts
        if: inputs.suite == 'matrix-input-cache'
        uses: actions/upload-artifact@v4
        with:
          name: focused-input-cache-${{ inputs.source_commit }}
          path: target/input-cache-facts.json
          if-no-files-found: error
          retention-days: 7
      - name: Run header redelivery diagnostic
        if: inputs.suite == 'history-redelivery'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e target/test-reports
          report_dir="$GITHUB_WORKSPACE/target/scalatest-history-redelivery-reports"
          test ! -e "$report_dir"
          spec=src/test/scala/org/ergoplatform/nodeView/history/StartupContinuationRepairSpecification.scala
          git ls-files --error-unmatch -- "$spec" >/dev/null
          mkdir -p "$report_dir"
          log_file="$RUNNER_TEMP/history-redelivery.log"
          set +e
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.StartupContinuationRepairSpecification -- -z redelivered -u $report_dir" \
            >"$log_file" 2>&1
          sbt_exit=$?
          set -e
          printf '%s\n' "$sbt_exit" > "$RUNNER_TEMP/history-redelivery.exit"
          printf 'Header redelivery sbt exit: %s\n' "$sbt_exit"
      - name: Classify header redelivery diagnostic
        if: inputs.suite == 'history-redelivery'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          expected_class = "org.ergoplatform.nodeView.history.StartupContinuationRepairSpecification"
          expected_case = "redelivered header after interrupted cleanup keeps one height-row ID"
          final_marker = "REDELIVERED_ROW_AND_DOWNLOAD_UNIQUE:"
          final_clue = final_marker + " row=2 download=2: "
          reports = sorted(Path("target/scalatest-history-redelivery-reports").glob("TEST-*.xml"))
          if len(reports) != 1:
              raise SystemExit(f"expected one header redelivery report, found {len(reports)}")
          root = ET.parse(reports[0]).getroot()
          suites = list(root.iter("testsuite"))
          cases = list(root.iter("testcase"))
          if len(suites) != 1 or len(cases) != 1:
              raise SystemExit(f"expected one suite and one case, found {len(suites)} and {len(cases)}")
          suite, case = suites[0], cases[0]
          if suite.get("name") not in (expected_class, expected_class.rsplit(".", 1)[-1]):
              raise SystemExit("wrong header redelivery suite")
          if case.get("classname") != expected_class or case.get("name") != expected_case:
              raise SystemExit("wrong header redelivery property")
          if case.get("status") is not None:
              raise SystemExit("unexpected testcase status attribute")
          if suite.get("tests") != "1" or suite.get("errors") != "0" or suite.get("skipped", "0") != "0":
              raise SystemExit("header redelivery case count or terminal status is inconclusive")
          exit_path = Path(os.environ["RUNNER_TEMP"]) / "history-redelivery.exit"
          sbt_exit = int(exit_path.read_text(encoding="utf-8").strip())
          failures = list(case.findall("failure"))
          children = list(case)
          if sbt_exit == 1 and suite.get("failures") == "1" and len(failures) == len(children) == 1:
              failure = failures[0]
              if failure.get("type") != "class org.scalatest.exceptions.TestFailedException":
                  raise SystemExit("wrong header redelivery failure type")
              message = failure.get("message", "")
              if message.count(final_marker) != 1 or message.count(final_clue) != 1:
                  raise SystemExit("header redelivery failed outside the exact final tuple")
              status, reason = "reproduced", "final_tuple_row2_download2"
          elif sbt_exit == 0 and suite.get("failures") == "0" and not children:
              status, reason = "not_reproduced", "target_passed"
          else:
              raise SystemExit("header redelivery result is inconclusive")
          log_path = Path(os.environ["RUNNER_TEMP"]) / "history-redelivery.log"
          facts = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "suite": suite.get("name"),
              "case_class": case.get("classname"),
              "case_name": case.get("name"),
              "tests": 1,
              "failures": int(suite.get("failures")),
              "errors": 0,
              "skipped": 0,
              "sbt_exit": sbt_exit,
              "status": status,
              "reason": reason,
              "xml_bytes": reports[0].stat().st_size,
              "xml_sha256": hashlib.sha256(reports[0].read_bytes()).hexdigest(),
              "log_bytes": log_path.stat().st_size,
              "log_sha256": hashlib.sha256(log_path.read_bytes()).hexdigest(),
          }
          Path("target/history-redelivery-facts.json").write_text(json.dumps(facts, sort_keys=True) + "\n", encoding="utf-8")
          print(f"header redelivery: {status}/{reason}, sbt_exit={sbt_exit}")
          PY
      - name: Retain header redelivery facts
        if: inputs.suite == 'history-redelivery'
        uses: actions/upload-artifact@v4
        with:
          name: focused-history-redelivery-${{ inputs.source_commit }}
          path: target/history-redelivery-facts.json
          if-no-files-found: error
          retention-days: 7
      - name: Run holder ordering cache prune diagnostic
        if: inputs.suite == 'holder-ordering-prune'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e target/test-reports
          report_dir="$GITHUB_WORKSPACE/target/scalatest-holder-ordering-prune-reports"
          test ! -e "$report_dir"
          spec=src/test/scala/org/ergoplatform/nodeView/viewholder/llm_generated/HolderOrderingCachePruneSpec.scala
          git ls-files --error-unmatch -- "$spec" >/dev/null
          mkdir -p "$report_dir"
          log_file="$RUNNER_TEMP/holder-ordering-prune.log"
          set +e
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.viewholder.llm_generated.HolderOrderingCachePruneSpec -- -z ordinary -u $report_dir" \
            >"$log_file" 2>&1
          sbt_exit=$?
          set -e
          printf '%s\n' "$sbt_exit" > "$RUNNER_TEMP/holder-ordering-prune.exit"
          printf 'Holder ordering prune sbt exit: %s\n' "$sbt_exit"
      - name: Classify holder ordering cache prune diagnostic
        if: inputs.suite == 'holder-ordering-prune'
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from xml.etree import ElementTree as ET

          expected_class = "org.ergoplatform.nodeView.viewholder.llm_generated.HolderOrderingCachePruneSpec"
          expected_case = "ordinary full-block progress prunes prior ordering transactions"
          final_marker = "HOLDER_PRUNE_FINAL: "
          final_frame = re.compile(r"(?m)^\s*at\s+.+\(HolderOrderingCachePruneSpec\.scala:49\)\s*$")
          reports = sorted(Path("target/scalatest-holder-ordering-prune-reports").glob("TEST-*.xml"))
          if len(reports) != 1:
              raise SystemExit(f"expected one holder ordering prune report, found {len(reports)}")
          root = ET.parse(reports[0]).getroot()
          suites = list(root.iter("testsuite"))
          cases = list(root.iter("testcase"))
          if len(suites) != 1 or len(cases) != 1:
              raise SystemExit(f"expected one suite and one case, found {len(suites)} and {len(cases)}")
          suite, case = suites[0], cases[0]
          if suite.get("name") not in (expected_class, expected_class.rsplit(".", 1)[-1]):
              raise SystemExit("wrong holder ordering prune suite")
          if case.get("classname") != expected_class or case.get("name") != expected_case:
              raise SystemExit("wrong holder ordering prune property")
          if case.get("status") is not None:
              raise SystemExit("unexpected testcase status attribute")
          if suite.get("tests") != "1" or suite.get("errors") != "0" or suite.get("skipped", "0") != "0":
              raise SystemExit("holder ordering prune count or terminal status is inconclusive")
          exit_path = Path(os.environ["RUNNER_TEMP"]) / "holder-ordering-prune.exit"
          sbt_exit = int(exit_path.read_text(encoding="utf-8").strip())
          failures = list(case.findall("failure"))
          children = list(case)
          if sbt_exit == 1 and suite.get("failures") == "1" and len(failures) == len(children) == 1:
              failure = failures[0]
              if failure.get("type") != "class org.scalatest.exceptions.TestFailedException":
                  raise SystemExit("wrong holder ordering prune failure type")
              message = failure.get("message", "")
              if message.count(final_marker) != 1:
                  raise SystemExit("holder ordering prune failed outside the final assertion")
              if final_frame.search(failure.text or "") is None:
                  raise SystemExit("holder ordering prune final source frame absent")
              status, reason = "reproduced", "final_holder_prune_assertion"
          elif sbt_exit == 0 and suite.get("failures") == "0" and not children:
              status, reason = "not_reproduced", "target_passed"
          else:
              raise SystemExit("holder ordering prune result is inconclusive")
          log_path = Path(os.environ["RUNNER_TEMP"]) / "holder-ordering-prune.log"
          facts = {
              "source_commit": os.environ["SOURCE_COMMIT"],
              "suite": suite.get("name"),
              "case_class": case.get("classname"),
              "case_name": case.get("name"),
              "tests": 1,
              "failures": int(suite.get("failures")),
              "errors": 0,
              "skipped": 0,
              "sbt_exit": sbt_exit,
              "status": status,
              "reason": reason,
              "xml_bytes": reports[0].stat().st_size,
              "xml_sha256": hashlib.sha256(reports[0].read_bytes()).hexdigest(),
              "log_bytes": log_path.stat().st_size,
              "log_sha256": hashlib.sha256(log_path.read_bytes()).hexdigest(),
          }
          Path("target/holder-ordering-prune-facts.json").write_text(
              json.dumps(facts, sort_keys=True) + "\n", encoding="utf-8")
          print(f"holder ordering prune: {status}/{reason}, sbt_exit={sbt_exit}")
          PY
      - name: Retain holder ordering cache prune facts
        if: inputs.suite == 'holder-ordering-prune'
        uses: actions/upload-artifact@v4
        with:
          name: focused-holder-ordering-prune-${{ inputs.source_commit }}
          path: target/holder-ordering-prune-facts.json
          if-no-files-found: error
          retention-days: 7
      - name: Run real holder fork-to-mempool regression
        if: inputs.suite == 'matrix-mempool'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run real holder wallet rollback and mempool closure
        if: inputs.suite == 'matrix-wallet-join'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run mempool provider regressions
        if: inputs.suite == 'mempool-providers'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolInputProvidersSpec"
      - name: Run affected Matrix wallet closure
        if: inputs.suite == 'matrix-wallet-closeout'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"' \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.persistence.OffChainRegistrySpec"
      - name: Run Digest proof retention through extra-index rebuild
        if: inputs.suite == 'digest-proof-rebuild'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.nodeView.history.extra.ExtraIndexerTemplateKeySpec"
      - name: Run applied transaction conflict closure
        if: inputs.suite == 'mempool-conflicts'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.AppliedTransactionConflictsSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.OrderedTxPoolSpec"
      # NiPoPoW runs use the real history producer, HTTP route and P2P cache consumer.
      - name: Run NiPoPoW producer and HTTP route regressions
        if: inputs.suite == 'nipopow-producer'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.http.routes.NipopowApiRoutesSpec"
      - name: Run NiPoPoW proof and consumer closure
        if: inputs.suite == 'nipopow-validation'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec" \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Run remaining NiPoPoW consumer and cross-version checks
        if: inputs.suite == 'nipopow-validation-remainder'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Retain test reports
        if: always() && inputs.suite != 'matrix-input-cache' && inputs.suite != 'history-redelivery' && inputs.suite != 'holder-ordering-prune'
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.suite }}-${{ inputs.source_commit }}
          path: |
            target/test-reports/
            ergo-core/target/test-reports/
          if-no-files-found: warn
          retention-days: 7
