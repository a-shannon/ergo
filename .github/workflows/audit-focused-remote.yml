name: Focused snapshot validation for PR 2519

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full source commit on this public fork
        required: true
        type: string
      suite:
        description: Affected integration closure
        required: true
        type: choice
        options:
          - pr2519-snapshot-join

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate exact input
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EVENT_SHA: ${{ github.sha }}
          SUITE: ${{ inputs.suite }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_COMMIT" = "$EVENT_SHA"
          test "$SUITE" = "pr2519-snapshot-join"
          test "$RUN_ATTEMPT" = "1"
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Confirm PR 2519 merge and snapshot closure
        id: source_check
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^)" = "214b2dcc2b8ae414e741b883513510fe22c3af7c"
          test "$(git rev-list --parents -n 1 HEAD^)" = "214b2dcc2b8ae414e741b883513510fe22c3af7c 0fcadacd69ebb42af4b5867669162df88b8fcc1d c1a69f65df2228ce26b7d1c2360b472ef79fc55c"
          test "$(git rev-list --parents -n 1 0fcadacd69ebb42af4b5867669162df88b8fcc1d)" = "0fcadacd69ebb42af4b5867669162df88b8fcc1d f3b7630771ec2a274510291e048cc709a5a7797e"
          test "$(git rev-list --parents -n 1 0d7806a90fc26b2ec6cffede6c1a144ca0fe2021)" = "0d7806a90fc26b2ec6cffede6c1a144ca0fe2021 c1a69f65df2228ce26b7d1c2360b472ef79fc55c f3b7630771ec2a274510291e048cc709a5a7797e"
          test "$(git rev-parse '214b2dcc2b8ae414e741b883513510fe22c3af7c^{tree}')" = "4041e3abb37b29cbc7752279e881c699f4330132"
          test "$(git rev-parse '0d7806a90fc26b2ec6cffede6c1a144ca0fe2021^{tree}')" = "abdae203debf2b757e8af910b9b40ae1ccd8dda2"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/audit-focused-remote.yml"
          test "$(git hash-object build.sbt)" = "6fc9ac87bc4d489029ef09c4dab9004b5556555d"
          test "$(git hash-object avldb/build.sbt)" = "4653df6e091d4b6e0a9cdd7206fa4c8c74f973ad"
          test "$(git hash-object project/build.properties)" = "61c9b1cb115daf7244c8bdf5afb23d24ff85d987"
          test "$(git hash-object avldb/src/main/scala/scorex/db/KVStoreReader.scala)" = "9147aeb358f1fd8c82da9ba6da60a435bda975d1"
          test "$(git hash-object avldb/src/main/scala/scorex/db/LDBKVStore.scala)" = "d2f9a320abe4e58f372f17b7448dea5307bd7adf"
          test "$(git hash-object avldb/src/main/scala/scorex/db/LDBVersionedStore.scala)" = "607073ba3c142b47d31f136468ecb389f1008cdf"
          test ! -e avldb/src/main/scala/scorex/db/LDBVersionedStoreJournal.scala
          test "$(git hash-object avldb/src/test/scala/scorex/db/LDBVersionedStoreSnapshotSpec.scala)" = "6f524fea5039570084add7931f5dceeabb30ac92"
          test "$(git hash-object avldb/src/main/scala/scorex/crypto/authds/avltree/batch/VersionedLDBAVLStorage.scala)" = "95d8e536dc82b561ec77880d4968845021738f07"
          test "$(git hash-object src/main/scala/org/ergoplatform/nodeView/history/storage/HistoryStorage.scala)" = "189c186aeacd9a4aab4272a2ec3f5a90ddaa2e5b"
      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-pr2519-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Setup Scala and Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run Scala 2.12 snapshot suite
        id: snapshot_212
        run: |
          set -euo pipefail
          test ! -d avldb/target/test-reports
          test ! -d target/test-reports
          log="$RUNNER_TEMP/pr2519-snapshot-2.12.log"
          set +e
          sbt -batch -Denv=test -Dsbt.log.noformat=true ++2.12.20 \
            "show avldb/scalaVersion" \
            "avldb/testOnly scorex.db.LDBVersionedStoreSnapshotSpec" \
            > "$log" 2>&1
          sbt_exit=$?
          python3 - "$log" "2.12.20" <<'PY'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          version = sys.argv[2]
          if sum(
              bool(re.fullmatch(r"(?:\[info\]\s*)?" + re.escape(version), line.strip()))
              for line in lines
          ) != 1:
              print("effective avldb Scala version not uniquely attested")
              raise SystemExit(1)
          print(f"effective_avldb_scala_version={version}")
          PY
          version_exit=$?
          report="avldb/target/test-reports/TEST-scorex.db.LDBVersionedStoreSnapshotSpec.xml"
          python3 - "$report" <<'PY'
          import sys
          from pathlib import Path
          expected = Path(sys.argv[1])
          roots = (Path("avldb/target/test-reports"), Path("target/test-reports"))
          try:
              if any(root.is_symlink() for root in roots):
                  exact = False
              else:
                  found = [
                      path for root in roots if root.is_dir()
                      for path in root.rglob("TEST-*.xml")
                  ]
                  exact = (
                      len(found) == 1 and found[0] == expected and
                      expected.is_file() and not expected.is_symlink()
                  )
          except OSError:
              exact = False
          print("report_set=" + ("exact" if exact else "inconclusive"))
          sys.exit(0 if exact else 1)
          PY
          report_set_exit=$?
          set -e
          dest=diagnostic-reports/scala-2.12.20
          mkdir -p "$dest/avldb"
          if [ "$version_exit" -eq 0 ]; then
            printf '2.12.20\n' > "$dest/effective-scala-version.txt"
          fi
          missing=0
          if [ -f "$report" ] && [ ! -L "$report" ] && [ -s "$report" ]; then
            mv "$report" "$dest/avldb/"
          else
            missing=1
          fi
          PHASE=2.12.20 SBT_EXIT="$sbt_exit" VERSION_EXIT="$version_exit" REPORT_SET_EXIT="$report_set_exit" python3 - "$log" "$dest/phase-status.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath
          log = Path(sys.argv[1]).read_bytes() if Path(sys.argv[1]).is_file() else b""
          location = None
          for line in log.decode(errors="replace").replace("\\", "/").splitlines():
              if "[error]" not in line:
                  continue
              match = re.search(
                  r"((?:avldb|src|ergo-core|ergo-wallet)/[A-Za-z0-9_./-]+\.scala):(\d+)",
                  line,
              )
              if match:
                  candidate = match.group(1)
                  normalized = PurePosixPath(candidate)
                  if (normalized.is_absolute() or ".." in normalized.parts or
                      normalized.as_posix() != candidate):
                      continue
                  try:
                      tracked = subprocess.run(
                          ["git", "ls-tree", "HEAD", "--", candidate],
                          capture_output=True, text=True,
                      )
                  except OSError:
                      continue
                  if (tracked.returncode == 0 and re.fullmatch(
                      r"100(?:644|755) blob [0-9a-f]{40}\t" + re.escape(candidate),
                      tracked.stdout.strip(),
                  )):
                      location = f"{candidate}:{match.group(2)}"
                      break
          Path(sys.argv[2]).write_text(json.dumps({
              "phase": os.environ["PHASE"],
              "sbtExit": int(os.environ["SBT_EXIT"]),
              "versionCheckExit": int(os.environ["VERSION_EXIT"]),
              "reportSetExit": int(os.environ["REPORT_SET_EXIT"]),
              "logSha256": hashlib.sha256(log).hexdigest(),
              "firstErrorLocation": location,
          }, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          if [ "$sbt_exit" -ne 0 ] || [ "$version_exit" -ne 0 ] || [ "$report_set_exit" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "verdict=inconclusive phase=2.12.20"
            exit 1
          fi
      - name: Run Scala 2.13 snapshot suite
        id: snapshot_213
        run: |
          set -euo pipefail
          first=diagnostic-reports/scala-2.12.20/avldb/TEST-scorex.db.LDBVersionedStoreSnapshotSpec.xml
          report=avldb/target/test-reports/TEST-scorex.db.LDBVersionedStoreSnapshotSpec.xml
          test -f "$first" && test ! -L "$first" && test -s "$first"
          test ! -e "$report"
          test ! -L "$report"
          log="$RUNNER_TEMP/pr2519-snapshot-2.13.log"
          set +e
          sbt -batch -Denv=test -Dsbt.log.noformat=true ++2.13.18 \
            "show avldb/scalaVersion" \
            "avldb/testOnly scorex.db.LDBVersionedStoreSnapshotSpec" \
            > "$log" 2>&1
          sbt_exit=$?
          python3 - "$log" "2.13.18" <<'PY'
          import re
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          version = sys.argv[2]
          if sum(
              bool(re.fullmatch(r"(?:\[info\]\s*)?" + re.escape(version), line.strip()))
              for line in lines
          ) != 1:
              print("effective avldb Scala version not uniquely attested")
              raise SystemExit(1)
          print(f"effective_avldb_scala_version={version}")
          PY
          version_exit=$?
          python3 - "$report" <<'PY'
          import sys
          from pathlib import Path
          expected = Path(sys.argv[1])
          roots = (Path("avldb/target/test-reports"), Path("target/test-reports"))
          try:
              if any(root.is_symlink() for root in roots):
                  exact = False
              else:
                  found = [
                      path for root in roots if root.is_dir()
                      for path in root.rglob("TEST-*.xml")
                  ]
                  exact = (
                      len(found) == 1 and found[0] == expected and
                      expected.is_file() and not expected.is_symlink()
                  )
          except OSError:
              exact = False
          print("report_set=" + ("exact" if exact else "inconclusive"))
          sys.exit(0 if exact else 1)
          PY
          report_set_exit=$?
          set -e
          dest=diagnostic-reports/scala-2.13.18
          mkdir -p "$dest/avldb"
          if [ "$version_exit" -eq 0 ]; then
            printf '2.13.18\n' > "$dest/effective-scala-version.txt"
          fi
          missing=0
          if [ -f "$report" ] && [ ! -L "$report" ] && [ -s "$report" ]; then
            mv "$report" "$dest/avldb/"
          else
            missing=1
          fi
          PHASE=2.13.18 SBT_EXIT="$sbt_exit" VERSION_EXIT="$version_exit" REPORT_SET_EXIT="$report_set_exit" python3 - "$log" "$dest/phase-status.json" <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path, PurePosixPath
          log = Path(sys.argv[1]).read_bytes() if Path(sys.argv[1]).is_file() else b""
          location = None
          for line in log.decode(errors="replace").replace("\\", "/").splitlines():
              if "[error]" not in line:
                  continue
              match = re.search(
                  r"((?:avldb|src|ergo-core|ergo-wallet)/[A-Za-z0-9_./-]+\.scala):(\d+)",
                  line,
              )
              if match:
                  candidate = match.group(1)
                  normalized = PurePosixPath(candidate)
                  if (normalized.is_absolute() or ".." in normalized.parts or
                      normalized.as_posix() != candidate):
                      continue
                  try:
                      tracked = subprocess.run(
                          ["git", "ls-tree", "HEAD", "--", candidate],
                          capture_output=True, text=True,
                      )
                  except OSError:
                      continue
                  if (tracked.returncode == 0 and re.fullmatch(
                      r"100(?:644|755) blob [0-9a-f]{40}\t" + re.escape(candidate),
                      tracked.stdout.strip(),
                  )):
                      location = f"{candidate}:{match.group(2)}"
                      break
          Path(sys.argv[2]).write_text(json.dumps({
              "phase": os.environ["PHASE"],
              "sbtExit": int(os.environ["SBT_EXIT"]),
              "versionCheckExit": int(os.environ["VERSION_EXIT"]),
              "reportSetExit": int(os.environ["REPORT_SET_EXIT"]),
              "logSha256": hashlib.sha256(log).hexdigest(),
              "firstErrorLocation": location,
          }, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          if [ "$sbt_exit" -ne 0 ] || [ "$version_exit" -ne 0 ] || [ "$report_set_exit" -ne 0 ] || [ "$missing" -ne 0 ]; then
            echo "verdict=inconclusive phase=2.13.18"
            exit 1
          fi
      - name: Classify exact snapshot reports
        if: always()
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_OUTCOME: ${{ steps.source_check.outcome }}
          TEST212_OUTCOME: ${{ steps.snapshot_212.outcome }}
          TEST213_OUTCOME: ${{ steps.snapshot_213.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath
          import xml.etree.ElementTree as ET

          reasons = []
          if (
              os.environ.get("SOURCE_OUTCOME"),
              os.environ.get("TEST212_OUTCOME"),
              os.environ.get("TEST213_OUTCOME"),
          ) != ("success", "success", "success"):
              reasons.append("source_or_test_step_failed")
          if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
              reasons.append("run_attempt_not_one")
          try:
              source = subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip()
          except (OSError, subprocess.CalledProcessError):
              source = ""
          if source != os.environ.get("SOURCE_COMMIT"):
              reasons.append("source_commit_mismatch")
          try:
              tracked_clean = all(
                  subprocess.run(
                      command, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  ).returncode == 0
                  for command in (
                      ["git", "diff", "--quiet"],
                      ["git", "diff", "--cached", "--quiet"],
                  )
              )
          except OSError:
              tracked_clean = False
          if not tracked_clean:
              reasons.append("tracked_source_changed_after_tests")

          snapshot_names = (
              "close control throwable propagates when ordinary processing failure is false",
              "close control throwable propagates when ordinary processing failure is true",
              "close interrupted exception propagates when ordinary processing failure is false",
              "close interrupted exception propagates when ordinary processing failure is true",
              "processing control throwable propagates when ordinary close failure is false",
              "processing control throwable propagates when ordinary close failure is true",
              "processing interrupted exception propagates when ordinary close failure is false",
              "processing interrupted exception propagates when ordinary close failure is true",
              "snapshot acquisition failure is returned without processing or closing an absent snapshot",
              "snapshot acquisition failure releases the write lock",
              "snapshot close failure is returned as a Failure",
              "snapshot processing failure closes the snapshot once",
              "snapshot processing failure remains primary when closing also fails",
              "snapshot reads stay stable while processing writes with the lock released",
              "the same processing and close failure does not cause self-suppression",
          )
          snapshot_suite = "scorex.db.LDBVersionedStoreSnapshotSpec"
          expected = {
              f"scala-{version}/avldb/TEST-{snapshot_suite}.xml":
                  (snapshot_suite, 15, snapshot_names)
              for version in ("2.12.20", "2.13.18")
          }
          report_root = Path("diagnostic-reports")
          actual = {
              p.relative_to(report_root).as_posix()
              for version in ("2.12.20", "2.13.18")
              for p in (report_root / f"scala-{version}").rglob("TEST-*.xml")
          }
          if actual != set(expected):
              reasons.append("report_set_mismatch")
          for version in ("2.12.20", "2.13.18"):
              marker = report_root / f"scala-{version}" / "effective-scala-version.txt"
              if (not marker.is_file() or marker.is_symlink() or
                  marker.read_text() != version + "\n"):
                  reasons.append(f"version_marker_{version}")
          phase_statuses = []
          def checked_location(raw):
              if not isinstance(raw, str):
                  return None
              match = re.fullmatch(
                  r"((?:avldb|src|ergo-core|ergo-wallet)/[A-Za-z0-9_./-]+\.scala):(\d+)",
                  raw,
              )
              if not match:
                  return None
              candidate = match.group(1)
              normalized = PurePosixPath(candidate)
              if (normalized.is_absolute() or ".." in normalized.parts or
                  normalized.as_posix() != candidate):
                  return None
              try:
                  tracked = subprocess.run(
                      ["git", "ls-tree", "HEAD", "--", candidate],
                      capture_output=True, text=True,
                  )
              except OSError:
                  return None
              if (tracked.returncode != 0 or not re.fullmatch(
                  r"100(?:644|755) blob [0-9a-f]{40}\t" + re.escape(candidate),
                  tracked.stdout.strip(),
              )):
                  return None
              return raw

          for version in ("2.12.20", "2.13.18"):
              status_file = report_root / f"scala-{version}" / "phase-status.json"
              if status_file.is_symlink():
                  reasons.append(f"nonregular_phase_status_{version}")
                  continue
              try:
                  phase_status = json.loads(status_file.read_text())
              except (OSError, ValueError):
                  reasons.append(f"missing_phase_status_{version}")
                  continue
              if not isinstance(phase_status, dict):
                  reasons.append(f"phase_status_shape_{version}")
                  continue
              raw_location = phase_status.get("firstErrorLocation")
              safe_location = checked_location(raw_location)
              if raw_location is not None and safe_location is None:
                  reasons.append(f"phase_location_invalid_{version}")
              log_hash = phase_status.get("logSha256")
              if not isinstance(log_hash, str) or not re.fullmatch(r"[0-9a-f]{64}", log_hash):
                  log_hash = ""
                  reasons.append(f"phase_log_hash_{version}")
              safe_phase = {
                  "phase": version if phase_status.get("phase") == version else "",
                  "sbtExit": phase_status.get("sbtExit") if type(phase_status.get("sbtExit")) is int else None,
                  "versionCheckExit": phase_status.get("versionCheckExit") if type(phase_status.get("versionCheckExit")) is int else None,
                  "reportSetExit": phase_status.get("reportSetExit") if type(phase_status.get("reportSetExit")) is int else None,
                  "logSha256": log_hash,
                  "firstErrorLocation": safe_location,
              }
              phase_statuses.append(safe_phase)
              if (
                  safe_phase["phase"] != version or
                  safe_phase["sbtExit"] != 0 or
                  safe_phase["versionCheckExit"] != 0 or
                  safe_phase["reportSetExit"] != 0 or
                  not safe_phase["logSha256"]
              ):
                  reasons.append(f"phase_status_{version}")
          if len(phase_statuses) != 2:
              reasons.append("phase_status_cardinality")
          if (list(Path("avldb/target/test-reports").glob("TEST-*.xml")) or
              list(Path("target/test-reports").glob("TEST-*.xml"))):
              reasons.append("unmoved_current_report")

          results = []
          projection_dir = report_root / "projections"
          projection_dir.mkdir(parents=True, exist_ok=True)
          test_source = Path(
              "avldb/src/test/scala/scorex/db/LDBVersionedStoreSnapshotSpec.scala"
          )
          try:
              test_line_bound = sum(1 for _ in test_source.open(encoding="utf-8"))
          except OSError:
              test_line_bound = 0
              reasons.append("snapshot_test_source_unreadable")
          for relative, (suite, count, required) in expected.items():
              path = report_root / relative
              if not path.is_file() or path.is_symlink():
                  reasons.append(f"missing_or_nonregular_{suite}")
                  continue
              try:
                  payload = path.read_bytes()
                  root = ET.fromstring(payload)
                  suites = list(root.iter("testsuite"))
                  cases = list(root.iter("testcase"))
                  counts = {
                      field: int(suites[0].attrib.get(
                          field, "0" if field == "skipped" else "-1"
                      ))
                      for field in ("tests", "failures", "errors", "skipped")
                  }
              except (OSError, ET.ParseError, ValueError, IndexError):
                  reasons.append(f"unreadable_{suite}")
                  continue
              raw_sha = hashlib.sha256(payload).hexdigest()
              projected = ET.Element("testsuite", {
                  "name": suite if root.attrib.get("name") == suite else "",
                  **{key: str(value) for key, value in counts.items()},
                  "rawSha256": raw_sha,
              })
              names = []
              case_results = []
              for case in cases:
                  name = case.attrib.get("name", "")
                  names.append(name)
                  faults = [child for child in case
                            if child.tag in ("failure", "error", "skipped")]
                  unexpected = [child for child in case
                                if child.tag not in (
                                    "failure", "error", "skipped", "system-out", "system-err"
                                )]
                  if len(faults) > 1:
                      reasons.append(f"multiple_case_outcomes_{suite}")
                  if unexpected:
                      reasons.append(f"unexpected_case_child_{suite}")
                  declared = case.attrib.get("status", "").lower()
                  allowed_positive = ("", "pass", "passed", "success")
                  if declared not in allowed_positive:
                      reasons.append(f"case_status_{suite}")
                  if faults:
                      status = faults[0].tag
                      if declared in allowed_positive and declared:
                          reasons.append(f"contradictory_case_status_{suite}")
                  elif unexpected:
                      status = "unknown"
                  elif declared in allowed_positive:
                      status = "pass"
                  else:
                      status = "unknown"
                  safe_name = name if name in required else ""
                  safe_class = suite if case.attrib.get("classname") == suite else ""
                  projected_case = ET.SubElement(projected, "testcase", {
                      "name": safe_name,
                      "classname": safe_class,
                      "status": status,
                  })
                  case_results.append({
                      "name": safe_name,
                      "classname": safe_class,
                      "status": status,
                  })
                  for fault in faults:
                      detail = fault.attrib.get("message", "") + "\n" + "".join(fault.itertext())
                      frame = re.search(
                          r"(?<![A-Za-z0-9_])LDBVersionedStoreSnapshotSpec\.scala:(\d{1,5})(?!\d)",
                          detail,
                      )
                      line = int(frame.group(1)) if frame else 0
                      safe_frame = (
                          f"LDBVersionedStoreSnapshotSpec.scala:{line}"
                          if 1 <= line <= test_line_bound else ""
                      )
                      raw_type = fault.attrib.get("type", "")
                      safe_type = raw_type if (
                          len(raw_type) <= 160 and re.fullmatch(
                              r"[A-Za-z_$][A-Za-z0-9_$]*(?:\.[A-Za-z_$][A-Za-z0-9_$]*)*",
                              raw_type,
                          )
                      ) else ""
                      ET.SubElement(projected_case, "fault", {
                          "type": safe_type,
                          "sourceFrame": safe_frame,
                          "detailSha256": hashlib.sha256(detail.encode()).hexdigest(),
                      })
              target = projection_dir / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              ET.ElementTree(projected).write(target, encoding="utf-8", xml_declaration=True)
              results.append({
                  "report": relative,
                  "suite": suite,
                  "counts": counts,
                  "cases": sorted(case_results, key=lambda item: item["name"]),
                  "rawXmlSha256": raw_sha,
              })
              if (root.tag != "testsuite" or len(suites) != 1 or
                  root.attrib.get("name") != suite):
                  reasons.append(f"suite_shape_{suite}")
              if counts != {
                  "tests": count, "failures": 0, "errors": 0, "skipped": 0
              }:
                  reasons.append(f"counts_{suite}")
              if (len(cases) != count or len(set(names)) != count or
                  any(case.attrib.get("classname") != suite for case in cases)):
                  reasons.append(f"cases_{suite}")
              if sorted(names) != sorted(required):
                  reasons.append(f"exact_case_set_{suite}")
              if any(
                  next(root.iter(tag), None) is not None
                  for tag in ("failure", "error", "skipped", "ignored")
              ):
                  reasons.append(f"case_result_{suite}")
              for field in ("ignored", "pending", "canceled"):
                  if root.attrib.get(field, "0") != "0":
                      reasons.append(f"nonzero_{field}_{suite}")
          if len(results) != 2:
              reasons.append("result_cardinality")

          receipt = {
              "schema": "pr2519-snapshot-v1",
              "classification": "PASS" if not reasons else "INCONCLUSIVE",
              "reasonCodes": sorted(set(reasons)),
              "sourceCommit": source,
              "sourceParent": "214b2dcc2b8ae414e741b883513510fe22c3af7c",
              "mergeTree": "4041e3abb37b29cbc7752279e881c699f4330132",
              "mergeParents": [
                  "0fcadacd69ebb42af4b5867669162df88b8fcc1d",
                  "c1a69f65df2228ce26b7d1c2360b472ef79fc55c",
              ],
              "baseMerge": "0d7806a90fc26b2ec6cffede6c1a144ca0fe2021",
              "baseMergeTree": "abdae203debf2b757e8af910b9b40ae1ccd8dda2",
              "testOnlyCommit": "0fcadacd69ebb42af4b5867669162df88b8fcc1d",
              "rootBuildBlob": "6fc9ac87bc4d489029ef09c4dab9004b5556555d",
              "avldbBuildBlob": "4653df6e091d4b6e0a9cdd7206fa4c8c74f973ad",
              "storeBlob": "607073ba3c142b47d31f136468ecb389f1008cdf",
              "readerBlob": "9147aeb358f1fd8c82da9ba6da60a435bda975d1",
              "snapshotTestBlob": "6f524fea5039570084add7931f5dceeabb30ac92",
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "trackedSourceClean": tracked_clean,
              "phases": phase_statuses,
              "results": results,
          }
          report_root.mkdir(parents=True, exist_ok=True)
          (report_root / "pr2519-snapshot-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n"
          )
          print(f"verdict={receipt['classification']}")
          for reason in receipt["reasonCodes"]:
              print(f"reason={reason}")
          if reasons:
              raise SystemExit(1)
          PY
      - name: Upload bounded test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2519-snapshot-${{ github.sha }}
          path: |
            diagnostic-reports/pr2519-snapshot-receipt.json
            diagnostic-reports/projections/
          if-no-files-found: error
          retention-days: 7
