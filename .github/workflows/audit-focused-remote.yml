name: Focused audit validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full source commit on this fork
        required: true
        type: string
      suite:
        description: Affected source closure
        required: true
        type: choice
        options:
          - matrix-pending
          - matrix-forks
          - matrix-mempool
          - matrix-wallet-join
          - matrix-wallet-closeout
          - digest-proof-rebuild
          - mempool-providers
          - mempool-conflicts
          - nipopow-producer
          - nipopow-validation
          - nipopow-validation-remainder
          - wallet-deep-rollback
          - wallet-v609-composition
          - wallet-v609-native
          - wallet-registry-addbox-result
          - blocks-route-v609
          - blocks-route-fix-v609
          - history-index-join-v609
          - history-repair-join-v609

permissions:
  contents: read

jobs:
  focused:
    if: inputs.suite != 'wallet-v609-native'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SUITE: ${{ inputs.suite }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$SUITE" in
            matrix-pending|matrix-forks|matrix-mempool|matrix-wallet-join|matrix-wallet-closeout|digest-proof-rebuild|mempool-providers|mempool-conflicts|nipopow-producer|nipopow-validation|nipopow-validation-remainder|wallet-deep-rollback|wallet-v609-composition|wallet-registry-addbox-result|blocks-route-v609|blocks-route-fix-v609|history-index-join-v609|history-repair-join-v609) ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm tested commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"'
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Build pinned Matrix SigmaState dependency
        if: inputs.suite == 'matrix-pending' || inputs.suite == 'matrix-forks' || inputs.suite == 'matrix-mempool' || inputs.suite == 'matrix-wallet-join' || inputs.suite == 'matrix-wallet-closeout'
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20
      - name: Setup Scala and Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run Matrix pending synchronization closure
        if: inputs.suite == 'matrix-pending'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.network.MatrixInputIdAdmissionSpec" \
            "testOnly org.ergoplatform.network.llm_generated.InputBlockPendingCacheSpec" \
            "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification"
      - name: Run Matrix fork completion and sibling regressions
        if: inputs.suite == 'matrix-forks'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.modifierprocessors.InputBlockProcessorSpecification"
      - name: Run real holder fork-to-mempool regression
        if: inputs.suite == 'matrix-mempool'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run real holder wallet rollback and mempool closure
        if: inputs.suite == 'matrix-wallet-join'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run mempool provider regressions
        if: inputs.suite == 'mempool-providers'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolInputProvidersSpec"
      - name: Run affected Matrix wallet closure
        if: inputs.suite == 'matrix-wallet-closeout'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"' \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.persistence.OffChainRegistrySpec"
      - name: Run Digest proof retention through extra-index rebuild
        if: inputs.suite == 'digest-proof-rebuild'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.nodeView.history.extra.ExtraIndexerTemplateKeySpec"
      - name: Run applied transaction conflict closure
        if: inputs.suite == 'mempool-conflicts'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.AppliedTransactionConflictsSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.OrderedTxPoolSpec"
      - name: Run deep rollback integration regression
        if: inputs.suite == 'wallet-deep-rollback'
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -Denv=test clean ++2.12.20 docker \
            'it:testOnly org.ergoplatform.it.DeepRollBackSpec'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("target/it-reports/TEST-org.ergoplatform.it.DeepRollBackSpec.xml")
          suite = ET.parse(report).getroot()
          if suite.attrib.get("name") != "org.ergoplatform.it.DeepRollBackSpec":
              raise SystemExit("Unexpected integration suite")
          for key in ("tests", "failures", "errors", "skipped"):
              if key not in suite.attrib:
                  raise SystemExit(f"Missing {key} in integration report")
          tests = int(suite.attrib["tests"])
          if tests < 1 or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("DeepRollBackSpec did not pass")
          print(f"DeepRollBackSpec: {tests} test(s) passed")
          PY
      - name: Run v6.0.9 composed wallet regressions
        if: inputs.suite == 'wallet-v609-composition'
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -batch -Denv=test ++2.12.20 \
            "ergoWallet/testOnly org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec org.ergoplatform.nodeView.wallet.ErgoWalletSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec org.ergoplatform.nodeView.wallet.persistence.WalletRegistrySpec" \
            "testOnly org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification org.ergoplatform.nodeView.viewholder.ChainSwitchMempoolSpec"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = {
              "org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec": Path("ergo-wallet/target/test-reports/TEST-org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec.xml"),
              "org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec.xml"),
              "org.ergoplatform.nodeView.wallet.ErgoWalletSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.ErgoWalletSpec.xml"),
              "org.ergoplatform.nodeView.wallet.WalletScanLogicSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.WalletScanLogicSpec.xml"),
              "org.ergoplatform.nodeView.wallet.persistence.WalletRegistrySpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.wallet.persistence.WalletRegistrySpec.xml"),
              "org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification": Path("target/test-reports/TEST-org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification.xml"),
              "org.ergoplatform.nodeView.viewholder.ChainSwitchMempoolSpec": Path("target/test-reports/TEST-org.ergoplatform.nodeView.viewholder.ChainSwitchMempoolSpec.xml"),
          }
          required_cases = {
              "org.ergoplatform.nodeView.wallet.ErgoWalletSpec": {
                  "reuse one actor-minted run for duplicate snapshot events and fence stale lifecycle messages",
                  "mint unique UTXO snapshot run tokens across wallet actor incarnations",
                  "fresh snapshot recovery installs each deferred registry and preserves the durable fence",
                  "quarantine startup catch-up when the next wallet block was pruned",
              },
              "org.ergoplatform.nodeView.wallet.WalletScanLogicSpec": {
                  "mining maturity does not credit an existing payment association twice",
              },
          }
          if len(reports) != 7:
              raise SystemExit("Expected seven composed-wallet suites")
          total = 0
          for name, report in reports.items():
              suite = ET.parse(report).getroot()
              if suite.tag != "testsuite" or suite.attrib.get("name") != name:
                  raise SystemExit(f"Unexpected test suite in {report}")
              for key in ("tests", "failures", "errors", "skipped"):
                  if key not in suite.attrib:
                      raise SystemExit(f"Missing {key} in {report}")
              tests = int(suite.attrib["tests"])
              if tests < 1 or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"Test suite did not pass: {name}")
              cases = {case.attrib["name"] for case in suite.findall("testcase")}
              if len(cases) != tests:
                  raise SystemExit(f"Test count mismatch in {report}")
              missing = required_cases.get(name, set()) - cases
              if missing:
                  raise SystemExit(f"Missing required cases in {name}: {sorted(missing)}")
              total += tests
          print(f"Composed wallet regressions: {total} test(s) passed across {len(reports)} suites")
          PY
      - name: Run wallet registry AddBox result regression
        if: inputs.suite == 'wallet-registry-addbox-result'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.persistence.WalletRegistryWriteResultSpec"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          name = "org.ergoplatform.nodeView.wallet.persistence.WalletRegistryWriteResultSpec"
          report = Path(f"target/test-reports/TEST-{name}.xml")
          suite = ET.parse(report).getroot()
          if suite.tag != "testsuite" or suite.attrib.get("name") != name:
              raise SystemExit("Unexpected wallet registry test suite")
          for key in ("tests", "failures", "errors", "skipped"):
              if key not in suite.attrib:
                  raise SystemExit(f"Missing {key} in {report}")
          tests = int(suite.attrib["tests"])
          if tests < 24 or any(int(suite.attrib[key]) != 0 for key in ("failures", "errors", "skipped")):
              raise SystemExit("Wallet registry test suite did not pass")
          cases = [case.attrib.get("name", "") for case in suite.findall("testcase")]
          if len(cases) != tests or len(set(cases)) != tests:
              raise SystemExit("Wallet registry testcase count or names do not match")
          expected_addbox_cases = {
              "should reply to AddBox with the registry success",
              "should reply to AddBox with the registry write failure",
              "should reply to AddBox with the registry validation failure",
          }
          addbox_cases = {case for case in cases if "AddBox" in case}
          if addbox_cases != expected_addbox_cases:
              raise SystemExit(f"Unexpected AddBox outcome cases: {sorted(addbox_cases)}")
          print(f"WalletRegistryWriteResultSpec: {tests} test(s) passed with all AddBox outcomes")
          PY
      - name: Run v6.0.9 blocks route contract
        if: inputs.suite == 'blocks-route-v609'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.http.routes.BlocksApiRouteSpec"
      - name: Verify blocks route case execution
        if: ${{ always() && inputs.suite == 'blocks-route-v609' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          name = "org.ergoplatform.http.routes.BlocksApiRouteSpec"
          report = Path(f"target/test-reports/TEST-{name}.xml")
          suite = ET.parse(report).getroot()
          if suite.tag != "testsuite" or suite.attrib.get("name") != name:
              raise SystemExit("Unexpected blocks route test suite")
          for key in ("tests", "failures", "errors", "skipped"):
              if key not in suite.attrib:
                  raise SystemExit(f"Missing {key} in {report}")
          cases = suite.findall("testcase")
          if len(cases) != int(suite.attrib["tests"]):
              raise SystemExit("Blocks route testcase count does not match")
          expected = {
              "should return method not allowed for PUT /blocks",
              "should not submit a valid block at an unknown sub-path",
              "should reject an unknown suffix after a known block id",
          }
          found = {}
          for case in cases:
              case_name = case.attrib.get("name", "")
              if case_name in expected:
                  if case_name in found or case.find("skipped") is not None:
                      raise SystemExit(f"Duplicate or skipped blocks route case: {case_name}")
                  found[case_name] = case
          if set(found) != expected:
              raise SystemExit(f"Missing blocks route cases: {sorted(expected - set(found))}")
          for case_name in sorted(expected):
              case = found[case_name]
              outcome = ("error" if case.find("error") is not None else
                         "failure" if case.find("failure") is not None else "passed")
              print(f"{case_name}: {outcome}")
          PY
      - name: Run corrected v6.0.9 blocks route contract
        if: inputs.suite == 'blocks-route-fix-v609'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.http.routes.BlocksApiRouteSpec org.ergoplatform.http.routes.ErgoHttpServiceSpec"
      - name: Verify corrected blocks route case execution
        if: ${{ always() && inputs.suite == 'blocks-route-fix-v609' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          names = (
              "org.ergoplatform.http.routes.BlocksApiRouteSpec",
              "org.ergoplatform.http.routes.ErgoHttpServiceSpec",
          )
          expected = {
              "should return method not allowed for PUT /blocks",
              "should not submit a valid block at an unknown sub-path",
              "should not report a wrong method for an unknown sub-path",
          }
          for name in names:
              report = Path(f"target/test-reports/TEST-{name}.xml")
              suite = ET.parse(report).getroot()
              if suite.tag != "testsuite" or suite.attrib.get("name") != name:
                  raise SystemExit(f"Unexpected test suite in {report}")
              keys = ("tests", "failures", "errors", "skipped")
              if any(key not in suite.attrib for key in keys):
                  raise SystemExit(f"Missing JUnit counts in {report}")
              declared = {key: int(suite.attrib[key]) for key in keys}
              cases = suite.findall("testcase")
              case_names = [case.attrib.get("name", "") for case in cases]
              if declared["tests"] < 1 or len(cases) != declared["tests"]:
                  raise SystemExit(f"Testcase count mismatch in {report}")
              if not all(case_names) or len(set(case_names)) != len(cases):
                  raise SystemExit(f"Missing or duplicate testcase names in {report}")
              for key in ("failures", "errors", "skipped"):
                  tag = {"failures": "failure", "errors": "error", "skipped": "skipped"}[key]
                  actual = sum(case.find(tag) is not None for case in cases)
                  if declared[key] != actual:
                      raise SystemExit(f"{key} count mismatch in {report}")
              if name.endswith("BlocksApiRouteSpec"):
                  missing = expected - set(case_names)
                  if missing:
                      raise SystemExit(f"Missing blocks route cases: {sorted(missing)}")
                  by_name = {case.attrib["name"]: case for case in cases}
                  for case_name in sorted(expected):
                      case = by_name[case_name]
                      if case.find("skipped") is not None:
                          raise SystemExit(f"Skipped blocks route case: {case_name}")
                      outcome = ("error" if case.find("error") is not None else
                                 "failure" if case.find("failure") is not None else "passed")
                      print(f"{case_name}: {outcome}")
              elif any(declared[key] != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"Composite HTTP service suite did not pass: {report}")
              print(f"{name}: {declared['tests']} case(s), "
                    f"{declared['failures']} failure(s), {declared['errors']} error(s), "
                    f"{declared['skipped']} skip(s)")
          PY
      - name: Run composed history index and cache regressions
        if: inputs.suite == 'history-index-join-v609'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.VerifyADHistorySpecification org.ergoplatform.nodeView.history.RepairCacheRaceSpecification"
      - name: Verify composed history regression execution
        if: ${{ always() && inputs.suite == 'history-index-join-v609' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "VerifyADHistorySpecification": (
                  "invalidating a retained-floor full block clears its selected full tip",
              ),
              "RepairCacheRaceSpecification": (
                  "a read racing repair cannot restore a removed height row",
                  "a cached hit stays available while an index removal finishes",
              ),
          }
          for short_name, required in expected.items():
              name = f"org.ergoplatform.nodeView.history.{short_name}"
              report = Path(f"target/test-reports/TEST-{name}.xml")
              suite = ET.parse(report).getroot()
              if suite.tag != "testsuite" or suite.attrib.get("name") != name:
                  raise SystemExit(f"Unexpected test suite in {report}")
              counts = {key: int(suite.attrib[key]) for key in
                        ("tests", "failures", "errors", "skipped")}
              cases = suite.findall("testcase")
              names = [case.attrib.get("name", "") for case in cases]
              if counts["tests"] < len(required) or len(cases) != counts["tests"]:
                  raise SystemExit(f"Testcase count mismatch in {report}")
              if not all(names) or len(names) != len(set(names)):
                  raise SystemExit(f"Missing or duplicate testcase names in {report}")
              if any(counts[key] != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"History suite did not pass: {report}")
              for phrase in required:
                  if not any(phrase in case_name for case_name in names):
                      raise SystemExit(f"Missing history case in {report}: {phrase}")
              print(f"{name}: {counts['tests']} passed, required cases present")
          PY
      - name: Run composed history repair and index regressions
        if: inputs.suite == 'history-repair-join-v609'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.VerifyADHistorySpecification org.ergoplatform.nodeView.history.RepairCacheRaceSpecification org.ergoplatform.nodeView.history.storage.HistoryStorageRemoveSpec org.ergoplatform.nodeView.history.HistoryRepairSpec org.ergoplatform.nodeView.history.StartupContinuationRepairSpecification"
      - name: Verify composed history repair regression execution
        if: ${{ always() && inputs.suite == 'history-repair-join-v609' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "org.ergoplatform.nodeView.history.VerifyADHistorySpecification": (
                  "invalidating a retained-floor full block clears its selected full tip",
              ),
              "org.ergoplatform.nodeView.history.RepairCacheRaceSpecification": (
                  "a read racing repair cannot restore a removed height row",
                  "a cached hit stays available while an index removal finishes",
              ),
              "org.ergoplatform.nodeView.history.storage.HistoryStorageRemoveSpec": (
                  "remove propagates an object-store failure without changing caches or indexes",
                  "remove propagates an index-store failure after invalidating only modifier caches",
              ),
              "org.ergoplatform.nodeView.history.HistoryRepairSpec": (
                  "forgetHeader propagates removal 1 and stops subsequent deletions",
                  "repair propagates removal 7 without clearing the retry index",
                  "repair retries when object removal commits but index removal 3 fails",
                  "startup owner propagates removal 7 failure and closes storage",
                  "startup preserves the repair error when closing storage also fails",
              ),
              "org.ergoplatform.nodeView.history.StartupContinuationRepairSpecification": (
                  "startup removes a continuation row left behind by interrupted header cleanup",
              ),
          }
          if len(expected) != 5:
              raise SystemExit("Expected five composed history suites")
          total = 0
          for name, required in expected.items():
              report = Path(f"target/test-reports/TEST-{name}.xml")
              suite = ET.parse(report).getroot()
              if suite.tag != "testsuite" or suite.attrib.get("name") != name:
                  raise SystemExit(f"Unexpected test suite in {report}")
              keys = ("tests", "failures", "errors", "skipped")
              if any(key not in suite.attrib for key in keys):
                  raise SystemExit(f"Missing JUnit counts in {report}")
              counts = {key: int(suite.attrib[key]) for key in keys}
              cases = suite.findall("testcase")
              names = [case.attrib.get("name", "") for case in cases]
              if counts["tests"] < len(required) or len(cases) != counts["tests"]:
                  raise SystemExit(f"Testcase count mismatch in {report}")
              if not all(names) or len(names) != len(set(names)):
                  raise SystemExit(f"Missing or duplicate testcase names in {report}")
              if any(counts[key] != 0 for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"History suite did not pass: {report}")
              if any(case.find(tag) is not None for case in cases
                     for tag in ("failure", "error", "skipped")):
                  raise SystemExit(f"Failed or skipped testcase in {report}")
              for phrase in required:
                  matching = [case_name for case_name in names if phrase in case_name]
                  if len(matching) != 1:
                      raise SystemExit(f"Missing or duplicate required case in {report}: {phrase}")
              total += counts["tests"]
              print(f"{name}: {counts['tests']} passed, required cases present")
          print(f"Composed history repair: {total} tests across {len(expected)} suites")
          PY
      # NiPoPoW runs use the real history producer, HTTP route and P2P cache consumer.
      - name: Run NiPoPoW producer and HTTP route regressions
        if: inputs.suite == 'nipopow-producer'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.http.routes.NipopowApiRoutesSpec"
      - name: Run NiPoPoW proof and consumer closure
        if: inputs.suite == 'nipopow-validation'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec" \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Run remaining NiPoPoW consumer and cross-version checks
        if: inputs.suite == 'nipopow-validation-remainder'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.suite }}-${{ inputs.source_commit }}
          path: |
            target/test-reports/
            target/it-reports/
            ergo-core/target/test-reports/
            ergo-wallet/target/test-reports/
          if-no-files-found: warn
          retention-days: 7

  native_wallet:
    if: inputs.suite == 'wallet-v609-native'
    name: Native wallet tests (${{ matrix.scala }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scala: ['2.13.18', '2.12.20']
    steps:
      - name: Validate exact source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$SOURCE_COMMIT" = '427d735e965b25dfbc335380d5ebcfac539545ab'
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm tested commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Setup Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Run native wallet tests
        shell: bash
        run: |
          set +e
          sbt ++${{ matrix.scala }} ergoWallet/test > "$RUNNER_TEMP/native-wallet.log" 2>&1
          result=$?
          echo "sbt exit status: $result"
          exit "$result"
      - name: Verify JUnit results
        if: always()
        env:
          REPORT_DIR: ergo-wallet/target/test-reports
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path(os.environ['REPORT_DIR']).glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No wallet JUnit XML reports')
          counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              suite = ET.parse(report).getroot()
              if suite.tag != 'testsuite':
                  raise SystemExit('Unexpected wallet JUnit XML root')
              for key in counts:
                  if key not in suite.attrib:
                      raise SystemExit(f'Missing {key} in {report}')
                  counts[key] += int(suite.attrib[key])
          print(f"Wallet XML: {len(reports)} suites, {counts}")
          if counts['tests'] < 91 or counts['skipped'] > 0 or counts['failures'] or counts['errors']:
              raise SystemExit('Wallet JUnit results failed')
          PY
