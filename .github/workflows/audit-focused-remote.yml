name: Focused audit validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full source commit on this fork
        required: true
        type: string
      suite:
        description: Affected source closure
        required: true
        type: choice
        options:
          - matrix-pending
          - matrix-forks
          - matrix-mempool
          - matrix-wallet-join
          - matrix-wallet-closeout
          - digest-proof-rebuild
          - mempool-providers
          - mempool-conflicts
          - nipopow-producer
          - nipopow-validation
          - nipopow-validation-remainder
          - lastkey-range

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate source identity
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SUITE: ${{ inputs.suite }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          case "$SUITE" in
            matrix-pending|matrix-forks|matrix-mempool|matrix-wallet-join|matrix-wallet-closeout|digest-proof-rebuild|mempool-providers|mempool-conflicts|nipopow-producer|nipopow-validation|nipopow-validation-remainder|lastkey-range) ;;
            *) exit 1 ;;
          esac
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Confirm tested commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: 'test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"'
      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Build pinned Matrix SigmaState dependency
        if: inputs.suite == 'matrix-pending' || inputs.suite == 'matrix-forks' || inputs.suite == 'matrix-mempool' || inputs.suite == 'matrix-wallet-join' || inputs.suite == 'matrix-wallet-closeout'
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20
      - name: Setup Scala and Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run Matrix pending synchronization closure
        if: inputs.suite == 'matrix-pending'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.network.MatrixInputIdAdmissionSpec" \
            "testOnly org.ergoplatform.network.llm_generated.InputBlockPendingCacheSpec" \
            "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification"
      - name: Run Matrix fork completion and sibling regressions
        if: inputs.suite == 'matrix-forks'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.history.modifierprocessors.InputBlockProcessorSpecification"
      - name: Run real holder fork-to-mempool regression
        if: inputs.suite == 'matrix-mempool'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run real holder wallet rollback and mempool closure
        if: inputs.suite == 'matrix-wallet-join'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"'
      - name: Run mempool provider regressions
        if: inputs.suite == 'mempool-providers'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolInputProvidersSpec"
      - name: Run affected Matrix wallet closure
        if: inputs.suite == 'matrix-wallet-closeout'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.wallet.InputBlockWalletSpec" \
            'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "longer input block fork removes a restored conflict when winner was never pooled"' \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletServiceSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec" \
            "testOnly org.ergoplatform.nodeView.wallet.persistence.OffChainRegistrySpec"
      - name: Run Digest proof retention through extra-index rebuild
        if: inputs.suite == 'digest-proof-rebuild'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.nodeView.history.extra.ExtraIndexerTemplateKeySpec"
      - name: Run applied transaction conflict closure
        if: inputs.suite == 'mempool-conflicts'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.nodeView.mempool.AppliedTransactionConflictsSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.ErgoMemPoolSpec" \
            "testOnly org.ergoplatform.nodeView.mempool.OrderedTxPoolSpec"
      # NiPoPoW runs use the real history producer, HTTP route and P2P cache consumer.
      - name: Run NiPoPoW producer and HTTP route regressions
        if: inputs.suite == 'nipopow-producer'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly org.ergoplatform.http.routes.NipopowApiRoutesSpec"
      - name: Run NiPoPoW proof and consumer closure
        if: inputs.suite == 'nipopow-validation'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec" \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Run remaining NiPoPoW consumer and cross-version checks
        if: inputs.suite == 'nipopow-validation-remainder'
        run: |
          sbt -batch -Denv=test ++2.12.20 \
            'set libraryDependencies += "com.typesafe.akka" %% "akka-http-testkit" % "10.2.7" % Test' \
            "testOnly *PoPowAlgosSpec *NipopowVerifierSpec *SerializationTests *PopowProcessorSpecification *NipopowApiRoutesSpec" \
            "testOnly *ErgoSanityUTXO *ErgoSanityDigest -- -z GetNipopowProof" \
            ++2.13.18 \
            "ergoCore/testOnly *ExtensionCandidateTest *PoPowHeaderSpec *NipopowProofInteropSpec"
      - name: Characterize the missing iterator close on the old product
        id: old_iterator
        if: inputs.suite == 'lastkey-range'
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BASE_COMMIT: 808189de57d67f2be1160c1ca56633077f3b3f40
        run: |
          product=avldb/src/main/scala/scorex/db/LDBKVStore.scala
          report=target/test-reports/TEST-org.ergoplatform.db.LDBKVStoreSpec.xml
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD:$product)" = 41c401ecfd76e1ebda51327a1e5083ad828609d5
          test "$(git rev-parse HEAD:src/test/scala/org/ergoplatform/db/LDBKVStoreSpec.scala)" = 1bcdbc8143f403c2b9f9492d4583f488f383678b
          git show "$BASE_COMMIT:$product" > "$product"
          test "$(git hash-object --path="$product" "$product")" = d2f9a320abe4e58f372f17b7448dea5307bd7adf
          set +e
          sbt -batch -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.db.LDBKVStoreSpec -- -z "lastKeyInRange closes its iterator on every completed or failed traversal"'
          test_exit=$?
          set -e
          mkdir -p diagnostic-reports/old-product
          cp "$report" diagnostic-reports/old-product/
          test "$test_exit" -ne 0
      - name: Validate the corrected product and retained range suite
        id: fixed_iterator
        if: inputs.suite == 'lastkey-range'
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          product=avldb/src/main/scala/scorex/db/LDBKVStore.scala
          git restore --source="$SOURCE_COMMIT" -- "$product"
          test "$(git hash-object --path="$product" "$product")" = 41c401ecfd76e1ebda51327a1e5083ad828609d5
          git diff --quiet
          sbt -batch -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.db.LDBKVStoreSpec"
      - name: Confirm exact old-red and corrected-green JUnit oracles
        if: inputs.suite == 'lastkey-range'
        env:
          OLD_OUTCOME: ${{ steps.old_iterator.outcome }}
          FIXED_OUTCOME: ${{ steps.fixed_iterator.outcome }}
        run: |
          test "$OLD_OUTCOME" = success
          test "$FIXED_OUTCOME" = success
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          name = "TEST-org.ergoplatform.db.LDBKVStoreSpec.xml"
          old = Path("diagnostic-reports/old-product") / name
          fixed = Path("target/test-reports") / name
          if not old.is_file() or not fixed.is_file():
              raise SystemExit("Missing old or corrected JUnit report")
          old_cases = ET.parse(old).getroot().findall(".//testcase")
          fixed_cases = ET.parse(fixed).getroot().findall(".//testcase")
          property_name = "lastKeyInRange closes its iterator on every completed or failed traversal"
          if len(old_cases) != 1 or old_cases[0].get("name") != property_name:
              raise SystemExit("Old product did not run only the intended close property")
          old_failure = old_cases[0].find("failure")
          if old_failure is None or old_cases[0].find("error") is not None:
              raise SystemExit("Old product did not fail one assertion")
          if old_cases[0].find("skipped") is not None:
              raise SystemExit("Old product skipped the diagnostic")
          if not old_failure.get("type", "").endswith("TestFailedException"):
              raise SystemExit("Old product failed outside the expected assertion class")
          if "0 was not equal to 1" not in old_failure.get("message", ""):
              raise SystemExit("Old product failed for a different reason")
          fixed_names = {case.get("name") for case in fixed_cases}
          if len(fixed_cases) != 11 or len(fixed_names) != 11:
              raise SystemExit("Corrected product did not run the complete pinned suite")
          if property_name not in fixed_names or "last key in range" not in fixed_names:
              raise SystemExit("Corrected product missed a named range property")
          if any(case.find(tag) is not None for case in fixed_cases
                 for tag in ("failure", "error", "skipped")):
              raise SystemExit("Corrected product has a failing or skipped case")
          print(f"old product: {len(old_cases)} expected failure; corrected product: {len(fixed_cases)} passed")
          PY
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.suite }}-${{ inputs.source_commit }}
          path: |
            target/test-reports/
            ergo-core/target/test-reports/
            diagnostic-reports/old-product/
          if-no-files-found: warn
          retention-days: 7
