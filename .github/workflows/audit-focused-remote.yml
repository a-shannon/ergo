name: Mixed release fork convergence

'on':
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full commit on this fork
        required: true
        type: string
      suite:
        description: Accepted compatibility run
        required: true
        type: choice
        options: [matrix-forks]

permissions:
  contents: read

jobs:
  observe:
    if: github.repository == 'a-shannon/ergo' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.sha == inputs.source_commit && inputs.suite == 'matrix-forks' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify sources and prepared observation
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git merge-base --is-ancestor 46d0beaa33562f099ff3579036238e78d314ed99 HEAD
          test "$(git diff --name-only 46d0beaa33562f099ff3579036238e78d314ed99 HEAD)" = "$(printf '%s\n' \
            .github/workflows/audit-focused-remote.yml \
            src/it/scala/org/ergoplatform/it/DeepRollBackSpec.scala \
            src/it/scala/org/ergoplatform/it/container/Docker.scala \
            src/test/compatibility/observe.py)"
          python3 -I -B -m py_compile src/test/compatibility/observe.py
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4
        with:
          jvm: temurin:8
          apps: sbt
      - name: Build candidate node image
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sbt -batch -Denv=test ++2.12.20 docker
          docker image inspect org.ergoplatform/ergo >/dev/null
      - name: Bind released node image
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          curl --fail --location --silent --show-error \
            https://github.com/ergoplatform/ergo/releases/download/v6.0.8/ergo-6.0.8.jar \
            --output "$RUNNER_TEMP/release/ergo-6.0.8.jar"
          echo 'e1269f3c9b1c75d29f1f1bded720101792db41118757016123de113668353346  ergo-6.0.8.jar' |
            (cd "$RUNNER_TEMP/release" && sha256sum --check)
          printf 'FROM org.ergoplatform/ergo\nCOPY ergo-6.0.8.jar /opt/ergo/ergo.jar\n' \
            > "$RUNNER_TEMP/release/Dockerfile"
          docker build --tag ergo-compat-release:6.0.8 "$RUNNER_TEMP/release"
          candidate_sha="$(docker run --rm --entrypoint sha256sum \
            org.ergoplatform/ergo /opt/ergo/ergo.jar | cut -d' ' -f1)"
          test "$candidate_sha" != e1269f3c9b1c75d29f1f1bded720101792db41118757016123de113668353346
          printf 'CANDIDATE_JAR_SHA=%s\n' "$candidate_sha" >> "$GITHUB_ENV"
          echo 'RELEASE_JAR_SHA=e1269f3c9b1c75d29f1f1bded720101792db41118757016123de113668353346' >> "$GITHUB_ENV"
      - name: v6.0.8 joins candidate branch
        id: release_follows
        continue-on-error: true
        timeout-minutes: 22
        shell: bash
        env:
          COMPAT_RELEASE_PEER: node10
          COMPAT_OBSERVER: ${{ github.workspace }}/src/test/compatibility/observe.py
          COMPAT_RECEIPTS: ${{ runner.temp }}/mixed-release-follows
          TMPDIR: ${{ runner.temp }}/mixed-release-follows
        run: |
          set -euo pipefail
          mkdir -p "$COMPAT_RECEIPTS"
          sbt -batch -Denv=test ++2.12.20 'it:testOnly org.ergoplatform.it.DeepRollBackSpec'
          test -s "$COMPAT_RECEIPTS/result.json"
      - name: Candidate joins v6.0.8 branch
        id: candidate_follows
        if: always() && steps.release_follows.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 22
        shell: bash
        env:
          COMPAT_RELEASE_PEER: node01
          COMPAT_OBSERVER: ${{ github.workspace }}/src/test/compatibility/observe.py
          COMPAT_RECEIPTS: ${{ runner.temp }}/mixed-candidate-follows
          TMPDIR: ${{ runner.temp }}/mixed-candidate-follows
        run: |
          set -euo pipefail
          mkdir -p "$COMPAT_RECEIPTS"
          sbt -batch -Denv=test ++2.12.20 'it:testOnly org.ergoplatform.it.DeepRollBackSpec'
          test -s "$COMPAT_RECEIPTS/result.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mixed-release-observations
          path: |
            ${{ runner.temp }}/mixed-release-follows/*.json
            ${{ runner.temp }}/mixed-candidate-follows/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Check both directions
        if: always()
        shell: bash
        env:
          RELEASE_OUTCOME: ${{ steps.release_follows.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate_follows.outcome }}
        run: |
          set -euo pipefail
          echo "release follows: $RELEASE_OUTCOME"
          echo "candidate follows: $CANDIDATE_OUTCOME"
          test "$RELEASE_OUTCOME" = success
          test "$CANDIDATE_OUTCOME" = success
