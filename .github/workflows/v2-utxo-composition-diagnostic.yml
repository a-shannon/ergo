name: V2 UTXO composition diagnostic

on:
  push:
    branches:
      - feat/v2-utxo-composed-20261012

jobs:
  utxo_sync:
    name: UtxoStateNodesSyncSpec on composed V2 fixes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact scratch branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify composed source and fixture pins
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = c10371015b681a148f41f6c99c2095032f5fc1f2
          test "$(git rev-parse HEAD~2)" = 1e3b8310200693992d0aa03356f08488fa10490f
          test "$(git diff --name-only HEAD~2 HEAD~1)" = src/test/scala/org/ergoplatform/nodeView/mempool/ErgoMemPoolSpec.scala
          git log -7 --format='%H %s'

      - name: Setup Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: v2-utxo-composition-sbt-20261012

      - name: Build node image and run exact UTXO sync spec
        timeout-minutes: 35
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -Denv=test clean ++2.12.20 docker "it:testOnly org.ergoplatform.it.UtxoStateNodesSyncSpec"

      - name: Save leftover node container logs
        if: failure() || cancelled()
        timeout-minutes: 3
        run: |
          mkdir -p target/logs/containers
          docker ps -a --filter name=ergo-itest- --format '{{.ID}} {{.Names}}' |
            while read -r id name; do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} finished={{.State.FinishedAt}}' "$id" || true
              docker logs --timestamps "$id" > "target/logs/containers/$name.log" 2>&1 || true
            done

      - name: Upload IT logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: v2-utxo-composition-logs
          path: |
            target/logs/
            target/it-reports/
          if-no-files-found: ignore
          retention-days: 30
