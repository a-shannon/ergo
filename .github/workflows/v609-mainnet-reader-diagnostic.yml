name: v6.0.9 MainNet reader diagnostic

on:
  push:
    branches:
      - a-shannon/v609-reader-release-diagnostic-20261025

permissions:
  contents: read

concurrency:
  group: v609-mainnet-reader-diagnostic
  cancel-in-progress: false

jobs:
  reader-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: 9b25896338c097b6487e521e31e66aad9f798f59
    steps:
      - name: Check out the diagnostic commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact release parent and test-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/a-shannon/v609-reader-release-diagnostic-20261025
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git rev-list --count "$SOURCE_COMMIT"..HEAD)" -eq 2
          test -z "$(git rev-list --merges "$SOURCE_COMMIT"..HEAD)"
          mapfile -t changed < <(git diff --name-only "$SOURCE_COMMIT" HEAD)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = .github/workflows/v609-mainnet-reader-diagnostic.yml
          test "${changed[1]}" = src/test/scala/org/ergoplatform/settings/ErgoSettingsReaderMainnetDefaultsSpec.scala
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Temurin 8 and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Run the single reader regression and classify the result
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          if sbt -batch -no-colors -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.settings.ErgoSettingsReaderMainnetDefaultsSpec' \
            > "$RUNNER_TEMP/v609-reader.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          RUN_RESULT="$result" python3 - <<'PY'
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'v609-reader.log').read_text(errors='replace')
          report = pathlib.Path('target/test-reports/TEST-org.ergoplatform.settings.ErgoSettingsReaderMainnetDefaultsSpec.xml')
          assert report.is_file(), 'The targeted test did not produce a JUnit report'
          suite = ET.parse(report).getroot()
          assert suite.get('name') == 'org.ergoplatform.settings.ErgoSettingsReaderMainnetDefaultsSpec'
          assert int(suite.get('tests', '-1')) == 1
          assert int(suite.get('failures', '-1')) == 1
          assert int(suite.get('errors', '-1')) == 0
          assert int(suite.get('skipped', '-1')) == 0
          assert int(os.environ['RUN_RESULT']) != 0, 'The regression unexpectedly passed'
          assert 'READER_CONTROL_OK' in log, 'The explicit-file control did not pass'
          match = re.search(r'READER_SELECTED_FAILURE (UnresolvedSubstitution|NotResolved)', log)
          assert match, 'The selected-network failure was not the expected config-resolution error'
          print('Exact v6.0.9 reader result: explicit-file control passed;')
          print('selected MainNet without a user file failed with ' + match.group(1) + '.')
          PY
