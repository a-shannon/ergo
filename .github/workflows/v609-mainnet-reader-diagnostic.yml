name: v6.0.9 MainNet reader diagnostic

on:
  push:
    branches:
      - a-shannon/v609-reader-release-diagnostic-20261025

permissions:
  contents: read

concurrency:
  group: v609-mainnet-reader-diagnostic
  cancel-in-progress: false

jobs:
  reader-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: 9b25896338c097b6487e521e31e66aad9f798f59
    steps:
      - name: Check out the diagnostic commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Verify exact release parent and test-only change
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/a-shannon/v609-reader-release-diagnostic-20261025
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git rev-list --count "$SOURCE_COMMIT"..HEAD)" -eq 3
          test -z "$(git rev-list --merges "$SOURCE_COMMIT"..HEAD)"
          mapfile -t changed < <(git diff --name-only "$SOURCE_COMMIT" HEAD)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = .github/workflows/v609-mainnet-reader-diagnostic.yml
          test "${changed[1]}" = src/test/scala/org/ergoplatform/settings/ErgoSettingsReaderMainnetDefaultsSpec.scala
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Temurin 8 and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Assemble the source JAR and probe its reader-only classpath
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          sbt -batch -no-colors -Denv=test ++2.12.20 'Test / compile' assembly
          mapfile -t jars < <(find target/scala-2.12 -maxdepth 1 -type f -name 'ergo-*.jar' -print)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          jar tf "$jar" > "$RUNNER_TEMP/v609-jar-entries.txt"
          grep -Fxq 'application.conf' "$RUNNER_TEMP/v609-jar-entries.txt"
          grep -Fxq 'mainnet.conf' "$RUNNER_TEMP/v609-jar-entries.txt"
          test -f target/scala-2.12/test-classes/org/ergoplatform/settings/ErgoSettingsReaderMainnetDefaultsProbe.class
          mkdir -p "$RUNNER_TEMP/v609-reader-tmp"
          if java -Djava.io.tmpdir="$RUNNER_TEMP/v609-reader-tmp" \
            -cp "$jar:target/scala-2.12/test-classes" \
            org.ergoplatform.settings.ErgoSettingsReaderMainnetDefaultsProbe \
            > "$RUNNER_TEMP/v609-packaged-reader.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          PACKAGED_RESULT="$result" python3 - <<'PY'
          import os
          import pathlib
          import re

          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'v609-packaged-reader.log').read_text(errors='replace')
          assert int(os.environ['PACKAGED_RESULT']) != 0, 'The selected-network reader unexpectedly succeeded'
          assert 'READER_CONTROL_OK' in log, 'The packaged application defaults did not pass the explicit-file control'
          assert 'READER_SELECTED_OK' not in log, 'The selected-network reader unexpectedly passed'
          match = re.search(r'READER_SELECTED_FAILURE (UnresolvedSubstitution|NotResolved)', log)
          assert match, 'The selected-network failure was not the expected config-resolution error'
          print('Exact v6.0.9 assembled-JAR classpath: explicit-file control passed;')
          print('selected MainNet reader without a user file failed with ' + match.group(1) + '.')
          PY
