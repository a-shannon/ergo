name: PR 2693 snapshot A to B recovery diagnostic

on:
  push:
    branches:
      - feat/pr2693-ab-recovery-diagnostic-20261017

permissions:
  contents: read

jobs:
  recovery-test:
    if: github.repository == 'a-shannon/ergo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR base and test increment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5b60b410a17213ad5bb9e90017624168369aaa30"
          test "$(git rev-parse HEAD^^)" = "3f8b7782d6d00e187a34a8e672b25e777532e2c3"
          git diff --exit-code HEAD^^ HEAD^ -- src/main
      - name: Set up Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Run focused actor and Holder recovery test
        timeout-minutes: 30
        run: sbt -batch -Denv=test ++2.12.20 "testOnly org.ergoplatform.network.ErgoNodeViewSynchronizerSpecification -- -z rejected"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2693-ab-recovery-${{ github.run_attempt }}
          path: |
            target/test-reports/
            target/scala-2.12/test-reports/
            target/logs/
          if-no-files-found: ignore
          retention-days: 14
