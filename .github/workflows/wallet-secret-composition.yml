name: Wallet secret candidate composition

on:
  push:
    branches:
      - a-shannon/wallet-secret-triple-v610-20261025

permissions:
  contents: read

jobs:
  wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scala: [2.12.20, 2.13.18]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Run wallet storage tests
        run: sbt ++${{ matrix.scala }} "ergoWallet/testOnly org.ergoplatform.wallet.secrets.JsonSecretStoragePersistenceSpec org.ergoplatform.wallet.secrets.JsonSecretStorageSpec"

      - name: Run wallet actor tests
        if: matrix.scala == '2.12.20'
        run: sbt ++2.12.20 "testOnly org.ergoplatform.nodeView.wallet.ErgoWalletSpec org.ergoplatform.nodeView.wallet.WalletRequestSecretErasureSpec"
