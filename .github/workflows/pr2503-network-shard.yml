name: PR 2503 exact-head network and mempool diagnostic

on:
  push:
    branches:
      - feat/pr2503-network-shard-20261017

permissions:
  contents: read

jobs:
  network-mempool:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: 94065cbdd7337695edb01237e6ded2f6714fdd23
          fetch-depth: 0

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = '94065cbdd7337695edb01237e6ded2f6714fdd23'

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Build pinned SigmaState dependency
        uses: ./.github/actions/bootstrap-sigmastate
        with:
          scala-version: 2.12.20

      - name: Setup Java and Scala
        uses: olafurpg/setup-scala@v10
        with:
          java-version: adopt@1.8

      - name: Run network and mempool suites
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostic
          sbt -Denv=test ++2.12.20 \
            "testOnly org.ergoplatform.network.* scorex.core.network.* org.ergoplatform.nodeView.mempool.*" \
            2>&1 | tee diagnostic/node-tests.log

      - name: Verify nonempty coverage in all three selected packages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          reports = sorted(Path("target/test-reports").rglob("*.xml"))
          names = []
          tests = 0
          for path in reports:
              root = ET.parse(path).getroot()
              names.append(f"{root.attrib.get('name', '')} {path.name}")
              tests += int(root.attrib.get("tests", "0"))
          prefixes = (
              "org.ergoplatform.network.",
              "scorex.core.network.",
              "org.ergoplatform.nodeView.mempool.",
          )
          missing = [prefix for prefix in prefixes if not any(prefix in name for name in names)]
          print(f"JUnit reports: {len(reports)}; tests: {tests}; missing packages: {missing}")
          if tests == 0 or missing:
              sys.exit(1)
          PY

      - name: Retain node test log and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2503-network-mempool-${{ github.run_id }}
          path: |
            diagnostic/node-tests.log
            target/test-reports/**
          if-no-files-found: warn
