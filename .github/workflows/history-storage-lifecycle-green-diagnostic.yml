name: History storage lifecycle diagnostic

on:
  push:
    branches:
      - a-shannon/history-storage-lifecycle-fix-v610-20261028

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Verify candidate identity
        env:
          SOURCE_COMMIT: 65704703845d04600813c27123bb634086a98928
          SOURCE_BLOB: 18fad60a0713fb3deb40eea64c43131c8db488ea
          LIFECYCLE_BLOB: 3e1dcf61619d8c055055be8596f570f57a96b589
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'a-shannon/ergo'
          test "$GITHUB_REF" = 'refs/heads/a-shannon/history-storage-lifecycle-fix-v610-20261028'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^")" = 38af08497838cd27b5621b4ef3354f2ac221e692
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          request = urllib.request.Request('https://api.github.com/repos/a-shannon/ergo', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              repository = json.load(response)
          assert repository.get('full_name') == 'a-shannon/ergo' and repository.get('private') is False
          base = 'c4692c22835f2ae39da5c6cb124eaee63f57bf7e'
          prefix = 'src/test/scala/org/ergoplatform/nodeView/history/storage/'
          files = {
              'src/main/scala/org/ergoplatform/nodeView/history/storage/HistoryStorage.scala': os.environ['SOURCE_BLOB'],
              prefix + 'HistoryStorageLifecycleSpec.scala': os.environ['LIFECYCLE_BLOB'],
              prefix + 'HistoryStorageCloseOverlapSpec.scala': 'bdc5808d6c5a19370be3bdd6c91e011503119dc6',
              prefix + 'HistoryStorageSpec.scala': 'bf02e9e2b2f5155d20cdadfc3bd940ad076668f7',
          }
          workflow = '.github/workflows/history-storage-lifecycle-green-diagnostic.yml'
          def delta(a, b):
              return set(subprocess.check_output(['git', 'diff', '--name-only', a, b], text=True).splitlines())
          assert delta('38af08497838cd27b5621b4ef3354f2ac221e692', os.environ['SOURCE_COMMIT']) == {
              'src/main/scala/org/ergoplatform/nodeView/history/storage/HistoryStorage.scala',
              prefix + 'HistoryStorageLifecycleSpec.scala',
          }
          assert delta(os.environ['SOURCE_COMMIT'], 'HEAD') == {workflow}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines())
          assert changed == set(files) - {prefix + 'HistoryStorageSpec.scala'} | {workflow}, changed
          for path, blob in files.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert actual == blob, path
          PY

      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Run targeted suites
        id: tests
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p target
          test ! -e target/test-reports && test ! -L target/test-reports
          mkdir "$RUNNER_TEMP/history-lifecycle-reports"
          ln -s "$RUNNER_TEMP/history-lifecycle-reports" target/test-reports
          sbt -Denv=test ++2.12.20 'testOnly org.ergoplatform.nodeView.history.storage.HistoryStorageLifecycleSpec org.ergoplatform.nodeView.history.storage.HistoryStorageCloseOverlapSpec org.ergoplatform.nodeView.history.storage.HistoryStorageSpec' > "$RUNNER_TEMP/history-lifecycle-sbt.log" 2>&1

      - name: Verify bounded JUnit results
        if: always() && steps.tests.outcome != 'skipped'
        id: results
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys, xml.etree.ElementTree as ET
          expected = {
              'HistoryStorageLifecycleSpec': {
                  'an in-flight operation completes before close enters a store',
                  'close-first blocks an operation and post-close reads reject cached data',
                  'close attempts every store once and failed close prevents deletion',
                  "an old instance cannot delete its live replacement's extra database",
              },
              'HistoryStorageCloseOverlapSpec': {
                  'extra batch completes and storage closes without a paused update',
                  'close must not enter the extra store while an extra batch is in flight',
              },
              'HistoryStorageSpec': {
                  'Write Read Remove',
                  'storage rent entries are removable by box id',
                  'rent scan stops at the creation-height cutoff and skips foreign keys',
                  'recursive extra index deletion propagates a file failure',
                  'extra serialization failure invalidates mutated cached objects',
                  'extra rows and checkpoint metadata share one batch and preserve returned write failures',
                  'an in-flight cache miss cannot restore stale data after a successful write',
              },
          }
          outcome = os.environ['TEST_OUTCOME'] if os.environ['TEST_OUTCOME'] in ('success', 'failure', 'cancelled') else 'unknown'
          result = {'sbt_outcome': outcome, 'suites': {}, 'valid': False}
          try:
              reports = list(pathlib.Path(os.environ['RUNNER_TEMP'], 'history-lifecycle-reports').iterdir())
              package = 'org.ergoplatform.nodeView.history.storage.'
              if {p.name for p in reports} != {'TEST-' + package + s + '.xml' for s in expected}:
                  raise ValueError('missing or extra JUnit reports')
              for report in reports:
                  root = ET.parse(report).getroot()
                  full_name = root.attrib.get('name', '')
                  suite = full_name.removeprefix(package)
                  if root.tag != 'testsuite' or full_name != package + suite or suite not in expected or report.name != 'TEST-' + full_name + '.xml' or suite in result['suites']:
                      raise ValueError('unexpected or duplicate suite')
                  cases = root.findall('testcase')
                  if int(root.attrib.get('tests', '-1')) != len(expected[suite]) or len(cases) != len(expected[suite]) or {c.attrib.get('name') for c in cases} != expected[suite] or any(c.find('failure') is not None or c.find('error') is not None or c.find('skipped') is not None for c in cases):
                      raise ValueError('missing, extra, failed, or skipped test case')
                  if any(int(root.attrib.get(k, '0')) != 0 for k in ('failures', 'errors', 'skipped')):
                      raise ValueError('JUnit suite reports failure')
                  result['suites'][suite] = len(cases)
              result['valid'] = set(result['suites']) == set(expected) and result['sbt_outcome'] == 'success'
          except (OSError, ValueError, ET.ParseError):
              pass
          pathlib.Path('diagnostic-result.json').write_text(json.dumps(result, sort_keys=True) + '\n', encoding='utf-8')
          sys.exit(0 if result['valid'] else 1)
          PY

      - name: Upload bounded result
        if: always() && steps.results.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: history-storage-lifecycle-result
          path: diagnostic-result.json
          if-no-files-found: error
          retention-days: 7
