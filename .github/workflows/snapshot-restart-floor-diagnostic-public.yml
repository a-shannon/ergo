name: Snapshot restart floor diagnostic

on:
  push:
    branches:
      - a-shannon/snapshot-restart-floor-v610-20261028

permissions:
  contents: read

jobs:
  restart-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify candidate scope
        env:
          BASE_SHA: c4692c22835f2ae39da5c6cb124eaee63f57bf7e
          PARENT_SHA: e2a35eef52245af97f5933b8f9aaf70a7f2b3cb7
          TEST_BLOB: f98630282ea8678e29d3306a78fa07af3df5b104
          PRODUCT_BLOB: 2b2361793e5947d144f2e08fbc691caf572af568
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          test "$(git rev-parse HEAD:src/test/scala/org/ergoplatform/nodeView/viewholder/ErgoNodeViewHolderSpec.scala)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:src/main/scala/org/ergoplatform/nodeView/history/storage/modifierprocessors/ToDownloadProcessor.scala)" = "$PRODUCT_BLOB"
          python3 - <<'PY'
          import os
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'HEAD'], text=True
          ).splitlines()
          expected = [
              '.github/workflows/snapshot-restart-floor-diagnostic-public.yml',
              'src/main/scala/org/ergoplatform/nodeView/history/storage/modifierprocessors/ToDownloadProcessor.scala',
              'src/test/scala/org/ergoplatform/nodeView/viewholder/ErgoNodeViewHolderSpec.scala',
          ]
          if sorted(changed) != expected:
              raise SystemExit('Unexpected changed paths')
          PY
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Run restart-floor properties and bootstrap controls
        run: |
          set -uo pipefail
          rm -f target/test-reports/TEST-org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec.xml \
            target/test-reports/TEST-org.ergoplatform.nodeView.history.UtxoBootstrapNoNipopowSyncSpecification.xml \
            target/test-reports/TEST-org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification.xml
          rc=0
          sbt -batch 'testOnly org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec -- -z "preserve a prepared snapshot floor after restart"' 'testOnly org.ergoplatform.nodeView.history.UtxoBootstrapNoNipopowSyncSpecification' 'testOnly org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification' > "$RUNNER_TEMP/snapshot-restart-sbt.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/snapshot-restart-exit"
      - name: Classify bounded JUnit result
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          result = {'classification': 'inconclusive'}
          suites = {
              'org.ergoplatform.nodeView.viewholder.ErgoNodeViewHolderSpec': [
                  'preserve a prepared snapshot floor after restart with all blocks retained',
                  'preserve a prepared snapshot floor after restart with finite retention',
              ],
              'org.ergoplatform.nodeView.history.UtxoBootstrapNoNipopowSyncSpecification': [
                  'utxo bootstrap without nipopow detects headers sync and requests snapshot info',
                  'headers sync transition must not poison isUtxoSnapshotApplied for pruned configs (blocksToKeep >= 0)',
              ],
              'org.ergoplatform.nodeView.history.storage.modifierprocessors.UtxoBootstrapToDownloadSpecification': [
                  'snapshot request is issued when headers chain synced and no full blocks applied',
                  'no repeated snapshot request once download plan is registered',
                  'toDownload returns no block sections before snapshot, and sections after snapshot',
                  'without utxoBootstrap no snapshot request and block sections downloaded as usual',
                  'near the tip, block sections are downloaded after snapshot applied on NiPoPoW-bootstrapped history',
              ],
          }
          try:
              rc = int((Path(os.environ['RUNNER_TEMP']) / 'snapshot-restart-exit').read_text().strip())
              result.update(sbt_exit=rc, suites={})
              if rc != 0:
                  raise ValueError('sbt failed')
              for suite, expected_names in suites.items():
                  report = Path('target/test-reports') / ('TEST-' + suite + '.xml')
                  root = ET.parse(report).getroot()
                  counts = {key: int(root.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped')}
                  cases = root.findall('testcase')
                  names = [case.get('name') for case in cases]
                  result['suites'][suite] = counts
                  if root.tag != 'testsuite' or root.get('name') != suite or counts != {'tests': len(expected_names), 'failures': 0, 'errors': 0, 'skipped': 0}:
                      raise ValueError('unexpected suite counts')
                  if len(cases) != len(expected_names) or sorted(names) != sorted(expected_names):
                      raise ValueError('unexpected test cases')
                  if any(case.findall(tag) for case in cases for tag in ('failure', 'error', 'skipped')):
                      raise ValueError('non-passing test case')
              result['classification'] = 'expected-green'
          except (OSError, ET.ParseError, KeyError, TypeError, ValueError) as exc:
              result['reason'] = type(exc).__name__
          output = Path('diagnostic.json')
          output.write_text(json.dumps(result, sort_keys=True) + '\n', encoding='utf-8')
          summary = 'Snapshot restart floor: ' + result['classification']
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(summary + '\n')
          if result['classification'] != 'expected-green':
              raise SystemExit(1)
          PY
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-restart-floor-${{ github.sha }}
          path: diagnostic.json
          if-no-files-found: warn
          retention-days: 7
