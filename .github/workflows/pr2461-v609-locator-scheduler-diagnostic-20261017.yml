name: PR 2461 v6.0.9 locator and scheduler diagnostic

on:
  push:
    branches:
      - feat/pr2461-v609-locator-scheduler-scratch-20261017

permissions:
  contents: read

jobs:
  focused-composition:
    if: github.repository == 'a-shannon/ergo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        spec: [ForkResolutionSpec, DeepRollBackSpec]
    steps:
      - name: Checkout exact composition
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify PR base and exact two-PR source composition
        shell: bash
        run: |
          set -euo pipefail
          base=91d4a654b57319e197276fa7a7011d9ff596e7b7
          test "$(git rev-parse c116e75919505d606eb5d6120d69b8fd2cace906^)" = "18a1978e041c9966147c87f758f22feb3cec2abd"
          git merge-base --is-ancestor c116e75919505d606eb5d6120d69b8fd2cace906 HEAD
          expected=$(printf '%s\n' \
            '.github/workflows/pr2461-v609-locator-diagnostic-20261017.yml' \
            'src/main/scala/org/ergoplatform/nodeView/history/ErgoHistoryReader.scala' \
            'src/main/scala/org/ergoplatform/nodeView/history/storage/modifierprocessors/ToDownloadProcessor.scala' | sort)
          actual=$(git diff --name-only "$base" c116e75919505d606eb5d6120d69b8fd2cace906 | sort)
          test "$actual" = "$expected"
          git diff --exit-code bec8c75284ecfff3e57450656c7540b9da9fced4 "$base" -- src/main
          git diff --exit-code c116e75919505d606eb5d6120d69b8fd2cace906 HEAD -- src/main src/it src/test
          git diff --check "$base" HEAD
      - name: Set up Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Run focused integration scenario
        timeout-minutes: 50
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -batch -Denv=test clean ++2.12.20 docker "it:testOnly *${{ matrix.spec }}"
      - name: Save remaining container logs
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p target/logs/containers
          docker ps -a --filter name=ergo-itest- --format '{{.ID}} {{.Names}}' |
            while read -r id name; do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$id" > "target/logs/containers/$name.state.log" 2>&1 || true
              docker logs --timestamps "$id" > "target/logs/containers/$name.log" 2>&1 || true
            done
      - name: Upload test report and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2461-v609-composed-${{ matrix.spec }}-${{ github.run_attempt }}
          path: |
            target/logs/
            target/it-reports/
          if-no-files-found: warn
          retention-days: 14
