name: Public mempool recheck diagnostic

on:
  push:
    branches:
      - a-shannon/mempool-reweight-red-v610-20261025

permissions:
  contents: read

jobs:
  reweight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Run same-ID recheck property
        run: sbt -Dsbt.supershell=false ++2.12.20 "testOnly org.ergoplatform.nodeView.mempool.OrderedTxPoolSpec -- -z refresh"
