name: Snapshot floor finalization diagnostic

on:
  push:
    branches:
      - a-shannon/snapshot-floor-finalizer-v610-20261026

permissions:
  contents: read

jobs:
  floor-finalizer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Confirm source and path scope
        env:
          BASE_SHA: f2f932bd6a0f8b3516a39f45f9f33f41b6b6f47e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          python3 - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
          ).splitlines()
          expected = [
              ".github/workflows/snapshot-floor-finalizer-diagnostic-public.yml",
              "src/test/scala/org/ergoplatform/nodeView/history/UtxoSetSnapshotProcessorSpecification.scala",
          ]
          if sorted(changed) != sorted(expected):
              raise SystemExit(f"Unexpected changed paths: {changed!r}")
          PY
          mkdir -p out
          printf 'base=%s\ncommit=%s\ntree=%s\n' "$BASE_SHA" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" > out/tree.txt

      - name: Set up Java 8 and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Cache Scala dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-snapshot-floor-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties') }}

      - name: Run affected snapshot suite
        run: |
          set -uo pipefail
          mkdir -p out
          rm -f target/test-reports/TEST-org.ergoplatform.nodeView.history.UtxoSetSnapshotProcessorSpecification.xml
          rc=0
          sbt -batch "testOnly org.ergoplatform.nodeView.history.UtxoSetSnapshotProcessorSpecification" > "$RUNNER_TEMP/snapshot-floor-sbt.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" > out/sbt-exit.txt

      - name: Check the isolated expected failure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/test-reports/TEST-org.ergoplatform.nodeView.history.UtxoSetSnapshotProcessorSpecification.xml")
          output = Path("out")
          if not report.is_file():
              raise SystemExit("No named JUnit report: compile/setup is not a test verdict")
          root = ET.parse(report).getroot()
          if root.tag != "testsuite":
              raise SystemExit("Unexpected JUnit root")
          counts = {key: int(root.get(key, "0")) for key in ("tests", "failures", "errors", "skipped")}
          cases = root.findall("testcase")
          if len(cases) != counts["tests"]:
              raise SystemExit("JUnit case count disagrees with suite summary")
          healthy = "registerManifestToDownload + getUtxoSetSnapshotDownloadPlan + getChunkIdsToDownload"
          faulted = "snapshot floor write failure retains the download needed for retry"
          named = {case.get("name"): case for case in cases}
          if healthy not in named or faulted not in named:
              raise SystemExit("Snapshot control or faulted case did not execute")
          if named[healthy].find("failure") is not None or named[healthy].find("error") is not None:
              raise SystemExit("Existing healthy prover control failed")
          failed = [case for case in cases if case.find("failure") is not None]
          if (
              counts != {"tests": 2, "failures": 1, "errors": 0, "skipped": 0}
              or len(failed) != 1
              or failed[0].get("name") != faulted
          ):
              raise SystemExit(f"Unexpected JUnit outcome: {counts}, failed={[c.get('name') for c in failed]}")
          message = failed[0].find("failure").get("message", "")
          for marker in ("planRetained=false", "chunksRetained=false", "floor=1"):
              if marker not in message:
                  raise SystemExit(f"Faulted case failed at a different assertion: missing {marker}")
          sbt_exit = int((output / "sbt-exit.txt").read_text().strip())
          if sbt_exit == 0:
              raise SystemExit("Sbt reported success despite the expected failed assertion")
          result = {
              "kind": "expected-red-snapshot-floor-finalizer",
              "tests": counts["tests"],
              "failures": counts["failures"],
              "errors": counts["errors"],
              "skipped": counts["skipped"],
              "healthy_control": healthy,
              "single_failed_case": faulted,
              "sbt_exit": sbt_exit,
          }
          (output / "diagnostic.json").write_text(json.dumps(result, sort_keys=True) + "\n")
          # The raw JUnit file stays on the runner: it can include JVM properties and test output.
          print("Expected-red snapshot finalizer case confirmed: 2 tests, one named assertion failure")
          PY
          echo "Expected-red processor/storage diagnostic only; no Holder, node or release verdict." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-floor-finalizer-${{ github.sha }}
          path: |
            out/tree.txt
            out/sbt-exit.txt
            out/diagnostic.json
          if-no-files-found: error
          retention-days: 7
