name: PR 2461 and 2535 fork isolation diagnostic

on:
  push:
    branches:
      - feat/pr2461-pr2535-composition-20261016

permissions:
  contents: read

jobs:
  fork-resolution:
    if: github.repository == 'a-shannon/ergo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact composition
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source parents and unchanged production code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2addec526d3672ebfa9c776da32e232c8a208a5e"
          test "$(git rev-parse HEAD^^1)" = "bec8c75284ecfff3e57450656c7540b9da9fced4"
          test "$(git rev-parse HEAD^^2)" = "d2f1cdab4ead9c614ab77f3ea39c66ae1894d3c8"
          git diff --exit-code bec8c75284ecfff3e57450656c7540b9da9fced4 HEAD -- src/main ergo-core/src/main avldb/src/main
          git show --no-patch --format=fuller HEAD
      - name: Set up Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt
      - name: Cache sbt dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}
      - name: Run isolated fork resolution fixture
        timeout-minutes: 32
        run: |
          mkdir -p tmp
          TMPDIR="$PWD/tmp" sbt -batch -Denv=test clean ++2.12.20 docker "it:testOnly *ForkResolutionSpec"
      - name: Save remaining container logs
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p target/logs/containers
          docker ps -a --filter name=ergo-itest- --format '{{.ID}} {{.Names}}' |
            while read -r id name; do
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$id" > "target/logs/containers/$name.state.log" 2>&1 || true
              docker logs --timestamps "$id" > "target/logs/containers/$name.log" 2>&1 || true
            done
      - name: Upload test report and node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2461-pr2535-fork-isolation-${{ github.run_attempt }}
          path: |
            target/logs/
            target/it-reports/
          if-no-files-found: warn
          retention-days: 14
