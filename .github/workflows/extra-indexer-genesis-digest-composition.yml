name: ExtraIndexer genesis Digest composition diagnostic

on:
  push:
    branches:
      - feat/genesis-digest-compose-20261013

jobs:
  composed_index:
    name: Verify composed genesis and Digest indexer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact composition
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java and Scala
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Cache sbt dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache/v1
            ~/.cache/coursier/v1
          key: ${{ runner.os }}-sbt-cache-v4-${{ hashFiles('**/*.sbt') }}-${{ hashFiles('project/build.properties') }}

      - name: Run composed indexer suites
        run: >-
          sbt -Denv=test ++2.12.20
          'testOnly
          org.ergoplatform.nodeView.history.extra.ExtraIndexerRestartSpec
          org.ergoplatform.nodeView.history.extra.GenesisIndexSpec
          org.ergoplatform.nodeView.history.extra.GenesisIndexApiSpec
          org.ergoplatform.nodeView.history.extra.ExtraIndexerRestoreJoinSpec
          org.ergoplatform.nodeView.history.extra.ExtraIndexerSpecification'
