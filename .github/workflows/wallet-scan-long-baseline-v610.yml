name: Public wallet scan Long baseline control

on:
  push:
    branches:
      - a-shannon/wallet-scan-long-reload-baseline-20261026

permissions:
  contents: read

jobs:
  persisted-long-baseline:
    if: github.repository == 'a-shannon/ergo' && github.event.repository.private == false && github.ref == 'refs/heads/a-shannon/wallet-scan-long-reload-baseline-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the intended public fork
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_PRIVATE: ${{ github.event.repository.private }}
          TARGET_API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = 'a-shannon/ergo'
          test "$TARGET_PRIVATE" = 'false'
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$TARGET_API/repos/$TARGET_REPOSITORY" |
            python3 -c "import json,sys; r=json.load(sys.stdin); assert r.get('full_name') == 'a-shannon/ergo' and r.get('private') is False"

      - name: Checkout the exact two-file baseline control
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify source and test identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f2f932bd6a0f8b3516a39f45f9f33f41b6b6f47e'
          diff -u \
            <(printf '%s\n' '.github/workflows/wallet-scan-long-baseline-v610.yml' 'src/test/scala/org/ergoplatform/nodeView/wallet/WalletScanLogicSpec.scala' | sort) \
            <(git diff-tree --no-commit-id --name-only -r HEAD | sort)
          test "$(git rev-parse HEAD:src/test/scala/org/ergoplatform/nodeView/wallet/WalletScanLogicSpec.scala)" = '2211008c89e9cb569c997d803e89c1c037eb1a94'
          test "$(git rev-parse HEAD:src/main/scala/org/ergoplatform/nodeView/wallet/scanning/ScanningPredicate.scala)" = '029368c93b5e7c56ceaf9517d6230aedaaf2e465'
          test "$(git rev-parse HEAD:build.sbt)" = '8cea4589cbfa270c06ba6db02e3a36cd7ab4ae4b'
          test "$(git rev-parse HEAD:src/main/scala/org/ergoplatform/nodeView/wallet/WalletScanLogic.scala)" = '68eb204d9ce10b1fc05794393901ba4b387861f2'
          test -z "$(git status --porcelain)"
          git diff --check HEAD^ HEAD

      - name: Set up Java 8 and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Run only the persisted Long rule property
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test ! -d target/test-reports
          mkdir -p diagnostic
          if sbt -batch -Denv=test ++2.12.20 \
            'testOnly org.ergoplatform.nodeView.wallet.WalletScanLogicSpec -- -z "persisted Long equality scan classifies future outputs after reopen"' \
            > diagnostic/runner.log 2>&1; then
            printf 'pass\n' > diagnostic/test-exit
          else
            printf 'failure\n' > diagnostic/test-exit
          fi

      - name: Classify only the named baseline assertion
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          suite_name = 'org.ergoplatform.nodeView.wallet.WalletScanLogicSpec'
          case_name = 'persisted Long equality scan classifies future outputs after reopen'
          marker = 'PERSISTED_LONG_SCAN_AFTER_REOPEN:'
          report_dir = Path('target/test-reports')
          report = report_dir / f'TEST-{suite_name}.xml'
          if sorted(report_dir.glob('*.xml')) != [report]:
              raise SystemExit('Inconclusive: expected exactly one focused JUnit report')
          suite = ET.parse(report).getroot()
          if suite.tag != 'testsuite' or suite.attrib.get('name') != suite_name:
              raise SystemExit('Inconclusive: unexpected test suite')
          counts = {key: int(suite.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped')}
          if counts != {'tests': 1, 'failures': 1, 'errors': 0, 'skipped': 0}:
              raise SystemExit(f'Inconclusive: unexpected JUnit counts {counts}')
          cases = suite.findall('testcase')
          if len(cases) != 1 or cases[0].attrib.get('name') != case_name:
              raise SystemExit('Inconclusive: selector did not isolate the property')
          failures = cases[0].findall('failure')
          if len(failures) != 1 or cases[0].findall('error') or cases[0].findall('skipped'):
              raise SystemExit('Inconclusive: unrelated testcase outcome')
          failure = failures[0]
          failure_type = failure.attrib.get('type', '')
          message = failure.attrib.get('message', '')
          trace = failure.text or ''
          if failure_type == 'org.scalatest.exceptions.TestFailedException':
              if not message.startswith(marker):
                  raise SystemExit('Inconclusive: target assertion marker mismatch')
          elif failure_type == 'sbt.ForkMain$ForkError':
              expected = 'org.scalatest.exceptions.TestFailedException: ' + marker
              if not message.startswith(expected) or (trace and not trace.startswith('sbt.ForkMain$ForkError: ' + expected)):
                  raise SystemExit('Inconclusive: wrapped target assertion marker mismatch')
          else:
              raise SystemExit('Inconclusive: unrelated failure type')
          if Path('diagnostic/test-exit').read_text().strip() != 'failure':
              raise SystemExit('Inconclusive: sbt and JUnit disagree')
          verdict = {
              'source_sha': 'f2f932bd6a0f8b3516a39f45f9f33f41b6b6f47e',
              'packet_sha': os.environ['GITHUB_SHA'],
              'suite': suite_name,
              'case': case_name,
              'tests': 1,
              'failures': 1,
              'errors': 0,
              'skipped': 0,
              'oracle': 'baseline_reloaded_long_rule_named_assertion',
          }
          Path('diagnostic/verdict.json').write_text(json.dumps(verdict, sort_keys=True) + '\n')
          print('Bounded baseline verdict: one named failure after the persistence and control assertions')
          PY

      - name: Recheck public visibility before retaining bounded result
        id: visibility_recheck
        if: always()
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = 'a-shannon/ergo'
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$TARGET_API/repos/$TARGET_REPOSITORY" |
            python3 -c "import json,sys; r=json.load(sys.stdin); assert r.get('full_name') == 'a-shannon/ergo' and r.get('private') is False"

      - name: Retain only sanitized verdict and exit marker
        if: always() && steps.classify.outcome == 'success' && steps.visibility_recheck.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: wallet-scan-long-baseline-v610
          path: |
            diagnostic/verdict.json
            diagnostic/test-exit
          if-no-files-found: error
          retention-days: 7
