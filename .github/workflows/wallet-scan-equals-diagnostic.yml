name: Wallet scan EQUALS diagnostic

on:
  push:
    branches:
      - a-shannon/wallet-scan-equals-ci-packet-v610-20261025

permissions:
  contents: read

jobs:
  scan-equals:
    name: Scanning predicate specification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8e7cfe4a00bbf603f8a38dd980e01bdce273ebaa HEAD

      - name: Set up Java and sbt
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:8
          apps: sbt

      - name: Run focused scanner tests
        run: sbt -Denv=test ++2.12.20 "testOnly org.ergoplatform.nodeView.wallet.scanning.ScanningPredicateSpecification"
